# N-Connect-Funkadapter für nRF52840-Dongle (Zephyr / nRF Connect SDK)

# Bluetooth: Zentrale (verbindet sich mit den Controllern) + Observer (Scan) + GATT-Client
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_SCAN=y
# Mehrere Controller gleichzeitig (Joy-Con-Paar = 2 Verbindungen)
CONFIG_BT_MAX_CONN=4
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y
# Öffentliche Adresse zur Laufzeit setzen (auf die PC-Adapter-Adresse)
CONFIG_BT_CTLR=y
# kein Pairing/Bonding nötig – die Switch-2-Controller verbinden sich unverschlüsselt
CONFIG_BT_SMP=n

# USB-CDC (virtueller COM-Port) für die Verbindung zu N-Connect
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="N-Connect Funkadapter"
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x520F
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Ringpuffer, Nebenläufigkeit
CONFIG_RING_BUFFER=y
CONFIG_EVENTS=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# LED-Status
CONFIG_GPIO=y

# Protokollausgaben nur über RTT, NICHT über USB (USB ist der Datenkanal zu N-Connect)
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
