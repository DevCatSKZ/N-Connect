<meta charset="UTF-8">

<title>N-Connect – Nintendo-Controller unter Windows</title>
<meta name="description" content="N-Connect bringt Nintendo-, PlayStation- und Xbox-Controller zuverlässig in Windows-Spiele – mit virtuellen Controllern, Gyro, Rumble und Profilen.">
<link rel="icon" href="logo.png">
<style>
  :root {
    /* Farbwelt des Logos: dunkles Navy, Neon-Blau und Violett */
    --bg: #070b1a; --panel: #0e1530; --panel2: #141c42; --line: #263066;
    --text: #eaf0ff; --muted: #93a0cc;
    --blue: #38bdf8; --violet: #a78bfa; --accent: #6ea8ff;
    --glow-b: rgba(56,189,248,.35); --glow-v: rgba(167,139,250,.30);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(1000px 500px at 80% -10%, rgba(167,139,250,.16) 0%, transparent 55%),
      radial-gradient(900px 500px at 15% -5%, rgba(56,189,248,.14) 0%, transparent 55%),
      var(--bg);
    color: var(--text); line-height: 1.6; min-height: 100vh;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 40px 24px 64px; }
  .topbar { display: flex; justify-content: flex-end; }
  select#lang {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font-size: 14px;
  }
  header { text-align: center; padding: 24px 0 40px; }
  header img.brand { width: 120px; height: 120px; border-radius: 28px;
    box-shadow: 0 0 40px var(--glow-b), 0 0 80px var(--glow-v); }
  .logo { font-size: 52px; font-weight: 700; letter-spacing: -1px; margin-top: 18px; }
  .logo span { background: linear-gradient(90deg, var(--blue), var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tagline { color: var(--muted); font-size: 19px; margin-top: 10px; }
  .cta { display: flex; gap: 14px; justify-content: center; margin-top: 32px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px; padding: 14px 28px;
    border-radius: 10px; font-size: 16px; font-weight: 600; text-decoration: none;
    border: 1px solid var(--line); transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary { background: linear-gradient(135deg, var(--blue), var(--violet)); color: #fff;
    box-shadow: 0 8px 28px var(--glow-v); }
  .btn-ghost { background: var(--panel); color: var(--text); }
  .ver { display: block; text-align: center; margin-top: 12px; color: var(--muted); font-size: 13px; min-height: 18px; }
  h2 { font-size: 26px; margin: 56px 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  .card h3 { font-size: 16px; margin-bottom: 8px; color: var(--blue); }
  .card p { color: var(--muted); font-size: 14.5px; }
  .pads { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  .shots { display: grid; grid-template-columns: 1fr; gap: 20px; }
  .shot { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .shot img { display: block; width: 100%; height: auto; }
  .shot figcaption { padding: 12px 18px; color: var(--muted); font-size: 14px; }
  .shot-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; margin-top: 20px; }
  .pad { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; font-size: 13.5px; color: var(--text); }
  ol.steps { margin-left: 22px; color: var(--muted); }
  ol.steps li { margin: 10px 0; }
  ol.steps b { color: var(--text); }
  footer { margin-top: 64px; text-align: center; color: var(--muted); font-size: 13px;
    border-top: 1px solid var(--line); padding-top: 24px; }
  a { color: var(--blue); }
</style>
</head>

let relTag = null;
function apply(code) {
  const t = I18N[code] || I18N.en;
  document.documentElement.lang = code;
  document.querySelectorAll("[data-i]").forEach(el => { if (t[el.dataset.i] !== undefined) el.innerHTML = t[el.dataset.i]; });
  document.querySelectorAll("[data-i-alt]").forEach(el => { if (t[el.dataset.iAlt]) el.alt = t[el.dataset.iAlt]; });
  document.title = code === "de" ? "N-Connect – Nintendo-Controller unter Windows" : "N-Connect – Nintendo controllers on Windows";
  if (relTag) document.getElementById("ver").textContent = t.version + relTag;
  localStorage.setItem("nc-lang", code);
}
const saved = localStorage.getItem("nc-lang");
const nav = (navigator.language || "en").slice(0, 2).toLowerCase();
const start = saved || (I18N[nav] ? nav : "en");
sel.value = start; apply(start);
sel.addEventListener("change", () => apply(sel.value));

fetch("https://api.github.com/repos/DevCatSKZ/N-Connect/releases/latest")
  .then(r => r.json())
  .then(rel => {
    const asset = (rel.assets || []).find(a => a.name.endsWith(".exe"));
    if (asset) document.getElementById("dl").href = asset.browser_download_url;
    relTag = rel.tag_name;
    const t = I18N[sel.value] || I18N.en;
    document.getElementById("ver").textContent = t.version + relTag;
  })
  .catch(() => {});
</script>
</body>
</html>
