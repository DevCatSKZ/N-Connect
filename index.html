  padsTitle:"Supported controllers", padsLead:"Via Bluetooth or USB cable – up to 8 at once.", padWired:"Wired controllers by HORI, PowerA, PDP",
  faqTitle:"Frequently asked questions",
  q1:"Does N-Connect cost anything?", a1:"No. N-Connect is free, has no ads and is open source (MIT license).",
  q2:"Do I need Bluetooth?", a2:"For wireless controllers, yes – the built-in Bluetooth is usually enough. Many controllers also work with a USB cable. For lots of controllers at once, a good Bluetooth adapter helps.",
  q3:"A controller shows up twice in Steam.", a3:"In N-Connect, turn on <b>General → Hide original controllers</b>, confirm the Windows prompt and restart Steam once.",
  q4:"Can I use the controller on my console again afterwards?", a4:"Yes. Just pair Switch 2 controllers with the console once more, then they work there as usual.",
  q5:"Does it work without installing?", a5:"Yes, with the portable ZIP version. The ViGEmBus and HidHide drivers still need to be installed on the PC once – the setup does that automatically.",
  q6:"Something doesn't work – what now?", a6:"Right-click the N-Connect icon in the bottom right → <b>Open log</b> and attach its content to a <a href=\"https://github.com/DevCatSKZ/N-Connect/issues\">bug report</a>.",
  legal:"N-Connect is an unofficial, free open-source project by devcatskz and is not affiliated with Nintendo, Sony or Microsoft. Trademarks belong to their owners.",
  source:"Source code on GitHub", allReleases:"All versions", bugs:"Report a problem" },
es: { name:"Español", title:"N-Connect – conecta tus mandos al PC fácilmente",
  navFeatures:"Funciones", navConnect:"Conectar", navControllers:"Mandos", navFaq:"Ayuda",
  tagline:"Mandos de Nintendo, PlayStation y Xbox en tu PC – conéctalos y juega a cualquier juego.",
  download:"Descargar para Windows", portable:"Versión portable (ZIP)", meta:"Gratis · Windows 10 y 11 · 12 idiomas", version:" · Versión ",
  smartscreen:"¿Windows muestra <b>«Windows protegió su PC»</b> al iniciar? Ocurre con programas nuevos sin un certificado caro. Haz clic en <b>Más información → Ejecutar de todas formas</b>: N-Connect es de código abierto.",
  shotAlt:"N-Connect: vista general con mandos conectados, batería y botones en directo",
  stepsTitle:"Empieza en 3 pasos",
  s1h:"Instalar", s1p:"Descarga el instalador y ejecútalo. Todo lo necesario se instala automáticamente.",
  s2h:"Conectar", s2p:"Pulsa el botón SYNC del mando: N-Connect lo encuentra solo.",
  s3h:"Jugar", s3p:"El mando funciona al instante: en Steam, Game Pass, emuladores y cualquier otro juego.",
  featTitle:"Qué hace N-Connect", featLead:"Muchos juegos solo entienden mandos de Xbox. N-Connect traduce tu mando para que cualquier juego lo reconozca, con muchos extras prácticos.",
  f1h:"Funciona en cualquier juego", f1p:"Tu mando aparece como mando de Xbox, o como mando de PlayStation con control de movimiento.",
  f2h:"Hasta 8 mandos", f2p:"Tú decides quién es el jugador 1, 2, 3… N-Connect recuerda el orden.",
  f3h:"Batería a la vista", f3p:"Nivel de batería de cada mando, con aviso antes de que se agote.",
  f4h:"Reasigna cualquier botón", f4p:"Incluso a teclado, ratón, turbo o secuencias de botones, con perfiles por juego.",
  f5h:"Apunta moviendo", f5p:"Los sensores de movimiento controlan la cámara o el ratón: ideal para shooters.",
  f6h:"Joy-Con como en la Switch", f6p:"En pareja o solos, en horizontal o vertical, incluso como ratón.",
  f7h:"Corrige el drift", f7p:"Vuelve a medir los sticks. El mando en sí no se modifica.",
  f8h:"Actualizaciones con un clic", f8p:"N-Connect avisa cuando hay una nueva versión y se actualiza solo.",
  connectTitle:"Cómo conectar tu mando",
  c1h:"Switch 2", c1p:"Pro Controller, Joy-Con 2 y GameCube: pulsa brevemente el <b>botón SYNC</b>. Pro Controller y GameCube también funcionan por cable USB.",
  c2h:"Switch", c2p:"Pro Controller, Joy-Con, NES, SNES, N64 y Mega Drive: pulsa el <b>botón SYNC</b> hasta que las luces se muevan.",
  c3h:"Wii y Wii U", c3p:"Pulsa el <b>botón SYNC</b> rojo: en el compartimento de las pilas del Wii Remote, en la parte inferior del Wii U Pro Controller.",
  c4h:"PlayStation", c4p:"Empareja DualShock 4 y DualSense una vez en la <b>configuración de Bluetooth de Windows</b> o conéctalos por cable USB.",
  c5h:"Xbox", c5p:"Simplemente conéctalo: por USB, Bluetooth o con el adaptador inalámbrico de Xbox.",
  connectNote:"La próxima vez basta con <b>pulsar cualquier botón</b>. <b>No</b> añadas los mandos de Switch 2 en la configuración de Bluetooth de Windows: solo pulsa SYNC.",
  galleryTitle:"Más vistas",
  g1alt:"Asignación de botones con perfiles", g1cap:"Reasigna botones libremente, con perfiles, turbo y macros.",
  g2alt:"Ajustes de sticks y vibración", g2cap:"Sticks, gatillos y vibración: para todos o por mando.",
  g3alt:"Ajustes directamente en un mando", g3cap:"Todos los ajustes directamente en cada mando.",
  padsTitle:"Mandos compatibles", padsLead:"Por Bluetooth o cable USB, hasta 8 a la vez.", padWired:"Mandos con cable de HORI, PowerA, PDP",
  faqTitle:"Preguntas frecuentes",
  q1:"¿N-Connect cuesta algo?", a1:"No. N-Connect es gratis, sin anuncios y de código abierto (licencia MIT).",
  q2:"¿Necesito Bluetooth?", a2:"Para mandos inalámbricos, sí: el Bluetooth integrado suele bastar. Muchos mandos también funcionan por cable USB. Para muchos mandos a la vez ayuda un buen adaptador Bluetooth.",
  q3:"Un mando aparece dos veces en Steam.", a3:"En N-Connect activa <b>General → Ocultar mandos originales</b>, confirma el aviso de Windows y reinicia Steam una vez.",
  q4:"¿Puedo volver a usar el mando en la consola?", a4:"Sí. Empareja de nuevo los mandos de Switch 2 con la consola una vez y funcionarán como siempre.",
  q5:"¿Funciona sin instalar?", a5:"Sí, con la versión portable en ZIP. Los controladores ViGEmBus y HidHide deben estar instalados una vez en el PC; el instalador lo hace automáticamente.",
  q6:"Algo no funciona, ¿qué hago?", a6:"Clic derecho en el icono de N-Connect abajo a la derecha → <b>Abrir registro</b> y adjunta su contenido a un <a href=\"https://github.com/DevCatSKZ/N-Connect/issues\">informe de problema</a>.",
  legal:"N-Connect es un proyecto no oficial, gratuito y de código abierto de devcatskz, sin relación con Nintendo, Sony ni Microsoft. Las marcas pertenecen a sus propietarios.",
  source:"Código fuente en GitHub", allReleases:"Todas las versiones", bugs:"Informar de un problema" },
fr: { name:"Français", title:"N-Connect – connectez vos manettes au PC facilement",
  navFeatures:"Fonctions", navConnect:"Connexion", navControllers:"Manettes", navFaq:"Aide",
  tagline:"Manettes Nintendo, PlayStation et Xbox sur votre PC – connectez-les et jouez à n'importe quel jeu.",
  download:"Télécharger pour Windows", portable:"Version portable (ZIP)", meta:"Gratuit · Windows 10 et 11 · 12 langues", version:" · Version ",
  smartscreen:"Windows affiche <b>« Windows a protégé votre ordinateur »</b> au premier lancement ? Cela arrive avec les nouveaux programmes sans certificat coûteux. Cliquez sur <b>Informations complémentaires → Exécuter quand même</b> – N-Connect est open source.",
  shotAlt:"N-Connect : vue d'ensemble avec manettes connectées, batterie et boutons en direct",
  stepsTitle:"Démarrer en 3 étapes",
  s1h:"Installer", s1p:"Téléchargez le programme d'installation et lancez-le. Tout le nécessaire est installé automatiquement.",
  s2h:"Connecter", s2p:"Appuyez sur le bouton SYNC de la manette – N-Connect la trouve tout seul.",
  s3h:"Jouer", s3p:"La manette fonctionne aussitôt – dans Steam, Game Pass, les émulateurs et tous les autres jeux.",
  featTitle:"Ce que fait N-Connect", featLead:"Beaucoup de jeux ne comprennent que les manettes Xbox. N-Connect traduit votre manette pour que chaque jeu la reconnaisse – avec de nombreux bonus pratiques.",
  f1h:"Fonctionne dans tous les jeux", f1p:"Votre manette apparaît comme une manette Xbox – ou comme une manette PlayStation avec détection de mouvement.",
  f2h:"Jusqu'à 8 manettes", f2p:"Vous choisissez qui est le joueur 1, 2, 3… N-Connect retient l'ordre.",
  f3h:"Batterie en un coup d'œil", f3p:"Niveau de batterie de chaque manette – avec alerte avant qu'elle soit vide.",
  f4h:"Réassigner chaque bouton", f4p:"Même au clavier, à la souris, au turbo ou à des suites de boutons – avec des profils par jeu.",
  f5h:"Viser en bougeant", f5p:"Les capteurs de mouvement contrôlent la caméra ou la souris – idéal pour les jeux de tir.",
  f6h:"Joy-Con comme sur Switch", f6p:"En paire ou seuls, à l'horizontale ou à la verticale – même comme souris.",
  f7h:"Corriger la dérive des sticks", f7p:"Mesurez simplement les sticks à nouveau. La manette elle-même n'est pas modifiée.",
  f8h:"Mises à jour en un clic", f8p:"N-Connect vous prévient d'une nouvelle version et se met à jour tout seul.",
  connectTitle:"Comment connecter votre manette",
  c1h:"Switch 2", c1p:"Pro Controller, Joy-Con 2 et GameCube : appuyez brièvement sur le <b>bouton SYNC</b>. Pro Controller et GameCube fonctionnent aussi en USB.",
  c2h:"Switch", c2p:"Pro Controller, Joy-Con, NES, SNES, N64 et Mega Drive : appuyez sur le <b>bouton SYNC</b> jusqu'à ce que les voyants défilent.",
  c3h:"Wii et Wii U", c3p:"Appuyez sur le <b>bouton SYNC</b> rouge – dans le compartiment à piles de la Wiimote, sous la manette Wii U Pro.",
  c4h:"PlayStation", c4p:"Associez une fois la DualShock 4 et la DualSense dans les <b>paramètres Bluetooth de Windows</b> ou branchez-les en USB.",
  c5h:"Xbox", c5p:"Branchez-la simplement – en USB, en Bluetooth ou avec l'adaptateur sans fil Xbox.",
  connectNote:"La fois suivante, <b>appuyer sur n'importe quel bouton</b> suffit. N'ajoutez <b>pas</b> les manettes Switch 2 dans les paramètres Bluetooth de Windows – appuyez seulement sur SYNC.",
  galleryTitle:"Autres vues",
  g1alt:"Assignation des boutons avec profils", g1cap:"Réassignez librement les boutons – avec profils, turbo et macros.",
  g2alt:"Réglages des sticks et des vibrations", g2cap:"Sticks, gâchettes et vibrations – pour toutes ou par manette.",
  g3alt:"Réglages directement sur une manette", g3cap:"Tous les réglages directement sur chaque manette.",
  padsTitle:"Manettes prises en charge", padsLead:"En Bluetooth ou par câble USB – jusqu'à 8 à la fois.", padWired:"Manettes filaires HORI, PowerA, PDP",
  faqTitle:"Questions fréquentes",
  q1:"N-Connect est-il payant ?", a1:"Non. N-Connect est gratuit, sans publicité et open source (licence MIT).",
  q2:"Ai-je besoin du Bluetooth ?", a2:"Pour les manettes sans fil, oui – le Bluetooth intégré suffit généralement. Beaucoup de manettes fonctionnent aussi en USB. Pour de nombreuses manettes à la fois, un bon adaptateur Bluetooth aide.",
  q3:"Une manette apparaît deux fois dans Steam.", a3:"Dans N-Connect, activez <b>Général → Masquer les manettes d'origine</b>, confirmez la demande de Windows et redémarrez Steam une fois.",
  q4:"Puis-je réutiliser la manette sur ma console ?", a4:"Oui. Associez simplement à nouveau les manettes Switch 2 à la console, puis elles fonctionnent comme d'habitude.",
  q5:"Est-ce que ça marche sans installation ?", a5:"Oui, avec la version portable ZIP. Les pilotes ViGEmBus et HidHide doivent toutefois être installés une fois sur le PC – le programme d'installation s'en charge.",
  q6:"Quelque chose ne marche pas – que faire ?", a6:"Clic droit sur l'icône N-Connect en bas à droite → <b>Ouvrir le journal</b> et joignez son contenu à un <a href=\"https://github.com/DevCatSKZ/N-Connect/issues\">signalement</a>.",
  legal:"N-Connect est un projet non officiel, gratuit et open source de devcatskz, sans lien avec Nintendo, Sony ou Microsoft. Les marques appartiennent à leurs propriétaires.",
  source:"Code source sur GitHub", allReleases:"Toutes les versions", bugs:"Signaler un problème" },
it: { name:"Italiano", title:"N-Connect – collega i controller al PC con facilità",
  navFeatures:"Funzioni", navConnect:"Collegare", navControllers:"Controller", navFaq:"Aiuto",
  tagline:"Controller Nintendo, PlayStation e Xbox sul PC – collegali e gioca a qualsiasi gioco.",
  download:"Scarica per Windows", portable:"Versione portable (ZIP)", meta:"Gratis · Windows 10 e 11 · 12 lingue", version:" · Versione ",
  smartscreen:"Windows mostra <b>«PC protetto da Windows»</b> al primo avvio? Succede con i programmi nuovi senza un certificato costoso. Fai clic su <b>Ulteriori informazioni → Esegui comunque</b>: N-Connect è open source.",
  shotAlt:"N-Connect: panoramica con controller collegati, batteria e tasti in tempo reale",
  stepsTitle:"Inizia in 3 passi",
  s1h:"Installa", s1p:"Scarica il programma di installazione e avvialo. Tutto il necessario viene installato automaticamente.",
  s2h:"Collega", s2p:"Premi il tasto SYNC sul controller: N-Connect lo trova da solo.",
  s3h:"Gioca", s3p:"Il controller funziona subito: in Steam, Game Pass, emulatori e qualsiasi altro gioco.",
  featTitle:"Cosa fa N-Connect", featLead:"Molti giochi capiscono solo i controller Xbox. N-Connect traduce il tuo controller perché ogni gioco lo riconosca, con tanti extra utili.",
  f1h:"Funziona in ogni gioco", f1p:"Il tuo controller appare come controller Xbox, o come controller PlayStation con sensori di movimento.",
  f2h:"Fino a 8 controller", f2p:"Decidi tu chi è il giocatore 1, 2, 3… N-Connect ricorda l'ordine.",
  f3h:"Batteria sempre visibile", f3p:"Livello della batteria di ogni controller, con avviso prima che si scarichi.",
  f4h:"Rimappa ogni tasto", f4p:"Anche su tastiera, mouse, turbo o sequenze di tasti, con profili per gioco.",
  f5h:"Mira muovendoti", f5p:"I sensori di movimento controllano la visuale o il mouse: ideale per gli sparatutto.",
  f6h:"Joy-Con come su Switch", f6p:"In coppia o singoli, in orizzontale o in verticale, persino come mouse.",
  f7h:"Correggi il drift", f7p:"Misura di nuovo gli stick. Il controller stesso non viene modificato.",
  f8h:"Aggiornamenti con un clic", f8p:"N-Connect ti avvisa quando c'è una nuova versione e si aggiorna da solo.",
  connectTitle:"Come collegare il controller",
  c1h:"Switch 2", c1p:"Pro Controller, Joy-Con 2 e GameCube: premi brevemente il <b>tasto SYNC</b>. Pro Controller e GameCube funzionano anche via cavo USB.",
  c2h:"Switch", c2p:"Pro Controller, Joy-Con, NES, SNES, N64 e Mega Drive: premi il <b>tasto SYNC</b> finché le luci scorrono.",
  c3h:"Wii e Wii U", c3p:"Premi il <b>tasto SYNC</b> rosso: nel vano batterie del Wii Remote, sotto il Wii U Pro Controller.",
  c4h:"PlayStation", c4p:"Associa una volta DualShock 4 e DualSense nelle <b>impostazioni Bluetooth di Windows</b> o collegali via cavo USB.",
  c5h:"Xbox", c5p:"Basta collegarlo: via USB, Bluetooth o adattatore wireless Xbox.",
  connectNote:"La volta successiva basta <b>premere un tasto qualsiasi</b>. <b>Non</b> aggiungere i controller Switch 2 nelle impostazioni Bluetooth di Windows: premi solo SYNC.",
  galleryTitle:"Altre schermate",
  g1alt:"Mappatura dei tasti con profili", g1cap:"Rimappa liberamente i tasti, con profili, turbo e macro.",
  g2alt:"Impostazioni di stick e vibrazione", g2cap:"Stick, grilletti e vibrazione: per tutti o per controller.",
  g3alt:"Impostazioni direttamente su un controller", g3cap:"Tutte le impostazioni direttamente su ogni controller.",
  padsTitle:"Controller supportati", padsLead:"Via Bluetooth o cavo USB, fino a 8 contemporaneamente.", padWired:"Controller cablati HORI, PowerA, PDP",
  faqTitle:"Domande frequenti",
  q1:"N-Connect costa qualcosa?", a1:"No. N-Connect è gratuito, senza pubblicità e open source (licenza MIT).",
  q2:"Mi serve il Bluetooth?", a2:"Per i controller wireless sì: di solito basta il Bluetooth integrato. Molti controller funzionano anche via cavo USB. Per molti controller insieme aiuta un buon adattatore Bluetooth.",
  q3:"Un controller appare due volte in Steam.", a3:"In N-Connect attiva <b>Generale → Nascondi i controller originali</b>, conferma la richiesta di Windows e riavvia Steam una volta.",
  q4:"Posso riusare il controller sulla console?", a4:"Sì. Associa di nuovo i controller Switch 2 alla console una volta e funzioneranno come sempre.",
  q5:"Funziona senza installazione?", a5:"Sì, con la versione portable ZIP. I driver ViGEmBus e HidHide devono però essere installati una volta sul PC: il programma di installazione lo fa in automatico.",
  q6:"Qualcosa non funziona: che faccio?", a6:"Clic destro sull'icona di N-Connect in basso a destra → <b>Apri registro</b> e allega il contenuto a una <a href=\"https://github.com/DevCatSKZ/N-Connect/issues\">segnalazione</a>.",
  legal:"N-Connect è un progetto non ufficiale, gratuito e open source di devcatskz, non affiliato a Nintendo, Sony o Microsoft. I marchi appartengono ai rispettivi proprietari.",
  source:"Codice sorgente su GitHub", allReleases:"Tutte le versioni", bugs:"Segnala un problema" },
pt: { name:"Português", title:"N-Connect – ligue os comandos ao PC com facilidade",
  navFeatures:"Funções", navConnect:"Ligar", navControllers:"Comandos", navFaq:"Ajuda",
  tagline:"Comandos Nintendo, PlayStation e Xbox no PC – basta ligar e jogar qualquer jogo.",
  download:"Transferir para Windows", portable:"Versão portátil (ZIP)", meta:"Gratuito · Windows 10 e 11 · 12 idiomas", version:" · Versão ",
  smartscreen:"O Windows mostra <b>«O Windows protegeu o seu PC»</b> no primeiro arranque? Acontece com programas novos sem um certificado caro. Clique em <b>Mais informações → Executar mesmo assim</b> – o N-Connect é open source.",
  shotAlt:"N-Connect: vista geral com comandos ligados, bateria e botões em tempo real",
  stepsTitle:"Comece em 3 passos",
  s1h:"Instalar", s1p:"Transfira o instalador e execute-o. Tudo o que é necessário é instalado automaticamente.",
  s2h:"Ligar", s2p:"Prima o botão SYNC do comando – o N-Connect encontra-o sozinho.",
  s3h:"Jogar", s3p:"O comando funciona logo – no Steam, Game Pass, emuladores e em todos os outros jogos.",
  featTitle:"O que o N-Connect faz", featLead:"Muitos jogos só entendem comandos Xbox. O N-Connect traduz o seu comando para que todos os jogos o reconheçam – com muitos extras práticos.",
  f1h:"Funciona em qualquer jogo", f1p:"O seu comando aparece como comando Xbox – ou como comando PlayStation com controlo de movimento.",
  f2h:"Até 8 comandos", f2p:"Decide quem é o jogador 1, 2, 3… O N-Connect memoriza a ordem.",
  f3h:"Bateria à vista", f3p:"Nível de bateria de cada comando – com aviso antes de acabar.",
  f4h:"Reatribuir qualquer botão", f4p:"Até para teclado, rato, turbo ou sequências de botões – com perfis por jogo.",
  f5h:"Apontar com movimento", f5p:"Os sensores de movimento controlam a câmara ou o rato – ideal para jogos de tiros.",
  f6h:"Joy-Con como na Switch", f6p:"Em par ou sozinhos, na horizontal ou vertical – até como rato.",
  f7h:"Corrigir o drift", f7p:"Volte a medir os manípulos. O comando em si não é alterado.",
  f8h:"Atualizações num clique", f8p:"O N-Connect avisa quando há uma nova versão e atualiza-se sozinho.",
  connectTitle:"Como ligar o seu comando",
  c1h:"Switch 2", c1p:"Pro Controller, Joy-Con 2 e GameCube: prima brevemente o <b>botão SYNC</b>. Pro Controller e GameCube também funcionam por cabo USB.",
  c2h:"Switch", c2p:"Pro Controller, Joy-Con, NES, SNES, N64 e Mega Drive: prima o <b>botão SYNC</b> até as luzes correrem.",
  c3h:"Wii e Wii U", c3p:"Prima o <b>botão SYNC</b> vermelho – no compartimento das pilhas do Wii Remote, na parte de baixo do Wii U Pro Controller.",
  c4h:"PlayStation", c4p:"Emparelhe o DualShock 4 e o DualSense uma vez nas <b>definições de Bluetooth do Windows</b> ou ligue-os por cabo USB.",
  c5h:"Xbox", c5p:"Basta ligar – por USB, Bluetooth ou adaptador sem fios Xbox.",
  connectNote:"Da próxima vez basta <b>premir qualquer botão</b>. <b>Não</b> adicione comandos Switch 2 nas definições de Bluetooth do Windows – prima apenas SYNC.",
  galleryTitle:"Mais vistas",
  g1alt:"Atribuição de botões com perfis", g1cap:"Reatribua botões livremente – com perfis, turbo e macros.",
  g2alt:"Definições de manípulos e vibração", g2cap:"Manípulos, gatilhos e vibração – para todos ou por comando.",
  g3alt:"Definições diretamente num comando", g3cap:"Todas as definições diretamente em cada comando.",
  padsTitle:"Comandos suportados", padsLead:"Por Bluetooth ou cabo USB – até 8 ao mesmo tempo.", padWired:"Comandos com fios HORI, PowerA, PDP",
  faqTitle:"Perguntas frequentes",
  q1:"O N-Connect custa alguma coisa?", a1:"Não. O N-Connect é gratuito, sem publicidade e open source (licença MIT).",
  q2:"Preciso de Bluetooth?", a2:"Para comandos sem fios, sim – o Bluetooth integrado normalmente chega. Muitos comandos também funcionam por cabo USB. Para muitos comandos ao mesmo tempo, ajuda um bom adaptador Bluetooth.",
  q3:"Um comando aparece duas vezes no Steam.", a3:"No N-Connect, ative <b>Geral → Ocultar comandos originais</b>, confirme o pedido do Windows e reinicie o Steam uma vez.",
  q4:"Posso voltar a usar o comando na consola?", a4:"Sim. Emparelhe novamente os comandos Switch 2 com a consola uma vez e funcionam como sempre.",
  q5:"Funciona sem instalar?", a5:"Sim, com a versão portátil ZIP. Os controladores ViGEmBus e HidHide têm de estar instalados uma vez no PC – o instalador faz isso automaticamente.",

  f5h:"Richten door te bewegen", f5p:"De bewegingssensoren sturen de camera of de muis – ideaal voor shooters.",
  f6h:"Joy-Con zoals op de Switch", f6p:"Als paar of los, liggend of staand – zelfs als muis.",
  f7h:"Stick-drift verhelpen", f7p:"Meet de sticks gewoon opnieuw. De controller zelf blijft ongewijzigd.",
  f8h:"Updates met één klik", f8p:"N-Connect meldt een nieuwe versie en werkt zichzelf bij.",
  connectTitle:"Zo verbind je je controller",
  c1h:"Switch 2", c1p:"Pro Controller, Joy-Con 2 en GameCube: druk kort op de <b>SYNC-knop</b>. Pro Controller en GameCube werken ook via een USB-kabel.",
  c2h:"Switch", c2p:"Pro Controller, Joy-Con, NES, SNES, N64 en Mega Drive: druk op de <b>SYNC-knop</b> tot de lampjes lopen.",
  c3h:"Wii en Wii U", c3p:"Druk op de rode <b>SYNC-knop</b> – in het batterijvak van de Wii Remote, aan de onderkant van de Wii U Pro Controller.",
  c4h:"PlayStation", c4p:"Koppel DualShock 4 en DualSense één keer in de <b>Bluetooth-instellingen van Windows</b> of sluit ze aan met een USB-kabel.",
  c5h:"Xbox", c5p:"Gewoon aansluiten – via USB, Bluetooth of de Xbox Wireless Adapter.",
  connectNote:"De volgende keer is <b>op een willekeurige knop drukken</b> genoeg. Voeg Switch 2-controllers <b>niet</b> toe in de Bluetooth-instellingen van Windows – druk alleen op SYNC.",
  galleryTitle:"Meer weergaven",
  g1alt:"Knoptoewijzing met profielen", g1cap:"Knoppen vrij instellen – met profielen, turbo en macro's.",
  g2alt:"Instellingen voor sticks en trillen", g2cap:"Sticks, triggers en trillen – voor alle of per controller.",
  g3alt:"Instellingen direct bij een controller", g3cap:"Alle instellingen direct bij elke controller.",
  padsTitle:"Ondersteunde controllers", padsLead:"Via Bluetooth of USB-kabel – tot 8 tegelijk.", padWired:"Bedrade controllers van HORI, PowerA, PDP",
  faqTitle:"Veelgestelde vragen",
  q1:"Kost N-Connect iets?", a1:"Nee. N-Connect is gratis, zonder reclame en open source (MIT-licentie).",
  q2:"Heb ik Bluetooth nodig?", a2:"Voor draadloze controllers wel – het ingebouwde Bluetooth volstaat meestal. Veel controllers werken ook via een USB-kabel. Voor veel controllers tegelijk helpt een goede Bluetooth-adapter.",
  q3:"Een controller verschijnt dubbel in Steam.", a3:"Zet in N-Connect <b>Algemeen → Originele controllers verbergen</b> aan, bevestig de vraag van Windows en start Steam één keer opnieuw.",
  q4:"Kan ik de controller daarna weer op de console gebruiken?", a4:"Ja. Koppel Switch 2-controllers gewoon nog één keer met de console, daarna werken ze daar zoals altijd.",
  q5:"Werkt het ook zonder installatie?", a5:"Ja, met de draagbare ZIP-versie. De stuurprogramma's ViGEmBus en HidHide moeten wel één keer op de pc geïnstalleerd zijn – de setup doet dat automatisch.",
  q6:"Iets werkt niet – wat nu?", a6:"Klik met rechts op het N-Connect-pictogram rechtsonder → <b>Logboek openen</b> en voeg de inhoud toe aan een <a href=\"https://github.com/DevCatSKZ/N-Connect/issues\">probleemmelding</a>.",
  legal:"N-Connect is een onofficieel, gratis open-sourceproject van devcatskz en niet verbonden met Nintendo, Sony of Microsoft. Merken zijn eigendom van hun eigenaren.",
  source:"Broncode op GitHub", allReleases:"Alle versies", bugs:"Probleem melden" },
pl: { name:"Polski", title:"N-Connect – łatwe podłączanie kontrolerów do PC",
  navFeatures:"Funkcje", navConnect:"Łączenie", navControllers:"Kontrolery", navFaq:"Pomoc",
  tagline:"Kontrolery Nintendo, PlayStation i Xbox na PC – po prostu połącz i graj w dowolną grę.",
  download:"Pobierz dla Windows", portable:"Wersja przenośna (ZIP)", meta:"Za darmo · Windows 10 i 11 · 12 języków", version:" · Wersja ",
  smartscreen:"Windows pokazuje przy pierwszym uruchomieniu <b>„System Windows ochronił ten komputer”</b>? Tak bywa z nowymi programami bez drogiego certyfikatu. Kliknij <b>Więcej informacji → Uruchom mimo to</b> – N-Connect jest open source.",
  shotAlt:"N-Connect: przegląd z połączonymi kontrolerami, poziomem baterii i przyciskami na żywo",
  stepsTitle:"Zacznij w 3 krokach",
  s1h:"Zainstaluj", s1p:"Pobierz instalator i uruchom go. Wszystko, co potrzebne, zostanie zainstalowane automatycznie.",
  s2h:"Połącz", s2p:"Naciśnij przycisk SYNC na kontrolerze – N-Connect sam go znajdzie.",
  s3h:"Graj", s3p:"Kontroler działa od razu – w Steam, Game Pass, emulatorach i wszystkich innych grach.",
  featTitle:"Co potrafi N-Connect", featLead:"Wiele gier rozumie tylko kontrolery Xbox. N-Connect tłumaczy twój kontroler tak, by każda gra go rozpoznała – z wieloma przydatnymi dodatkami.",
  f1h:"Działa w każdej grze", f1p:"Twój kontroler jest widoczny jako kontroler Xbox – albo jako kontroler PlayStation ze sterowaniem ruchem.",
  f2h:"Do 8 kontrolerów", f2p:"Ty decydujesz, kto jest graczem 1, 2, 3… N-Connect zapamiętuje kolejność.",
  f3h:"Bateria pod kontrolą", f3p:"Poziom baterii każdego kontrolera – z ostrzeżeniem, zanim się rozładuje.",
  f4h:"Dowolne przypisanie przycisków", f4p:"Także klawiatura, mysz, turbo lub sekwencje przycisków – z profilami dla gier.",
  f5h:"Celowanie ruchem", f5p:"Czujniki ruchu sterują kamerą lub myszą – idealne do strzelanek.",
  f6h:"Joy-Con jak na Switchu", f6p:"W parze lub osobno, poziomo lub pionowo – nawet jako mysz.",
  f7h:"Usuń dryf gałek", f7p:"Po prostu zmierz gałki ponownie. Sam kontroler pozostaje niezmieniony.",
  f8h:"Aktualizacje jednym kliknięciem", f8p:"N-Connect informuje o nowej wersji i sam się aktualizuje.",
  connectTitle:"Jak połączyć kontroler",
  c1h:"Switch 2", c1p:"Pro Controller, Joy-Con 2 i GameCube: krótko naciśnij <b>przycisk SYNC</b>. Pro Controller i GameCube działają też przez kabel USB.",
  c2h:"Switch", c2p:"Pro Controller, Joy-Con, NES, SNES, N64 i Mega Drive: naciśnij <b>przycisk SYNC</b>, aż diody zaczną migać.",
  c3h:"Wii i Wii U", c3p:"Naciśnij czerwony <b>przycisk SYNC</b> – w komorze baterii Wii Remote, na spodzie Wii U Pro Controller.",
  c4h:"PlayStation", c4p:"Sparuj DualShock 4 i DualSense raz w <b>ustawieniach Bluetooth systemu Windows</b> lub podłącz kablem USB.",
  c5h:"Xbox", c5p:"Po prostu podłącz – przez USB, Bluetooth lub adapter bezprzewodowy Xbox.",
  connectNote:"Następnym razem wystarczy <b>nacisnąć dowolny przycisk</b>. <b>Nie</b> dodawaj kontrolerów Switch 2 w ustawieniach Bluetooth systemu Windows – naciśnij tylko SYNC.",
  galleryTitle:"Więcej widoków",
  g1alt:"Przypisanie przycisków z profilami", g1cap:"Dowolnie przypisuj przyciski – z profilami, turbo i makrami.",
  g2alt:"Ustawienia gałek i wibracji", g2cap:"Gałki, spusty i wibracje – dla wszystkich lub dla każdego kontrolera.",
  g3alt:"Ustawienia bezpośrednio przy kontrolerze", g3cap:"Wszystkie ustawienia bezpośrednio przy każdym kontrolerze.",
  padsTitle:"Obsługiwane kontrolery", padsLead:"Przez Bluetooth lub kabel USB – do 8 naraz.", padWired:"Kontrolery przewodowe HORI, PowerA, PDP",
  faqTitle:"Częste pytania",
  q1:"Czy N-Connect coś kosztuje?", a1:"Nie. N-Connect jest darmowy, bez reklam i open source (licencja MIT).",
  q2:"Czy potrzebuję Bluetooth?", a2:"Dla kontrolerów bezprzewodowych tak – zwykle wystarczy wbudowany Bluetooth. Wiele kontrolerów działa też przez kabel USB. Przy wielu kontrolerach naraz pomoże dobry adapter Bluetooth.",
  q3:"Kontroler widać w Steam dwa razy.", a3:"W N-Connect włącz <b>Ogólne → Ukryj oryginalne kontrolery</b>, potwierdź pytanie systemu Windows i uruchom Steam ponownie.",
  q4:"Czy mogę potem znów używać kontrolera na konsoli?", a4:"Tak. Sparuj kontrolery Switch 2 jeszcze raz z konsolą, a potem działają jak zwykle.",
  q5:"Czy działa bez instalacji?", a5:"Tak, w wersji przenośnej ZIP. Sterowniki ViGEmBus i HidHide muszą jednak być raz zainstalowane na PC – instalator robi to automatycznie.",
  q6:"Coś nie działa – co robić?", a6:"Kliknij prawym przyciskiem ikonę N-Connect w prawym dolnym rogu → <b>Otwórz dziennik</b> i dołącz jego treść do <a href=\"https://github.com/DevCatSKZ/N-Connect/issues\">zgłoszenia problemu</a>.",
  legal:"N-Connect to nieoficjalny, darmowy projekt open source autorstwa devcatskz, niezwiązany z Nintendo, Sony ani Microsoft. Znaki towarowe należą do ich właścicieli.",
  source:"Kod źródłowy na GitHubie", allReleases:"Wszystkie wersje", bugs:"Zgłoś problem" },
ru: { name:"Русский", title:"N-Connect – простое подключение контроллеров к ПК",
  navFeatures:"Возможности", navConnect:"Подключение", navControllers:"Контроллеры", navFaq:"Помощь",
  tagline:"Контроллеры Nintendo, PlayStation и Xbox на ПК – просто подключите и играйте в любую игру.",
  download:"Скачать для Windows", portable:"Портативная версия (ZIP)", meta:"Бесплатно · Windows 10 и 11 · 12 языков", version:" · Версия ",
  smartscreen:"При первом запуске Windows показывает <b>«Система Windows защитила ваш компьютер»</b>? Так бывает с новыми программами без дорогого сертификата. Нажмите <b>Подробнее → Выполнить в любом случае</b> – N-Connect с открытым исходным кодом.",
  shotAlt:"N-Connect: обзор с подключёнными контроллерами, зарядом и кнопками в реальном времени",
  stepsTitle:"Начните за 3 шага",
  s1h:"Установить", s1p:"Скачайте установщик и запустите его. Всё необходимое установится автоматически.",
  s2h:"Подключить", s2p:"Нажмите кнопку SYNC на контроллере – N-Connect найдёт его сам.",
  s3h:"Играть", s3p:"Контроллер сразу работает – в Steam, Game Pass, эмуляторах и всех остальных играх.",
  featTitle:"Что умеет N-Connect", featLead:"Многие игры понимают только контроллеры Xbox. N-Connect «переводит» ваш контроллер, чтобы его узнала любая игра, – и добавляет много полезного.",
  f1h:"Работает в любой игре", f1p:"Ваш контроллер виден как контроллер Xbox – или как контроллер PlayStation с датчиками движения.",
  f2h:"До 8 контроллеров", f2p:"Вы решаете, кто игрок 1, 2, 3… N-Connect запоминает порядок.",
  f3h:"Заряд на виду", f3p:"Заряд каждого контроллера – с предупреждением, пока он не сел.",
  f4h:"Любые назначения кнопок", f4p:"Даже на клавиатуру, мышь, турбо или последовательности кнопок – с профилями для игр.",
  f5h:"Прицеливание движением", f5p:"Датчики движения управляют камерой или мышью – идеально для шутеров.",
  f6h:"Joy-Con как на Switch", f6p:"Парой или по одному, горизонтально или вертикально – даже как мышь.",
  f7h:"Устранение дрейфа стиков", f7p:"Просто откалибруйте стики заново. Сам контроллер не изменяется.",
  f8h:"Обновления в один клик", f8p:"N-Connect сообщает о новой версии и обновляется сам.",
  connectTitle:"Как подключить контроллер",
  c1h:"Switch 2", c1p:"Pro Controller, Joy-Con 2 и GameCube: коротко нажмите <b>кнопку SYNC</b>. Pro Controller и GameCube работают и по USB-кабелю.",
  c2h:"Switch", c2p:"Pro Controller, Joy-Con, NES, SNES, N64 и Mega Drive: нажмите <b>кнопку SYNC</b>, пока не побегут огоньки.",
  c3h:"Wii и Wii U", c3p:"Нажмите красную <b>кнопку SYNC</b> – в батарейном отсеке Wii Remote, на нижней стороне Wii U Pro Controller.",
  c4h:"PlayStation", c4p:"Один раз выполните сопряжение DualShock 4 и DualSense в <b>параметрах Bluetooth Windows</b> или подключите их USB-кабелем.",
  c5h:"Xbox", c5p:"Просто подключите – по USB, Bluetooth или через беспроводной адаптер Xbox.",
  connectNote:"В следующий раз достаточно <b>нажать любую кнопку</b>. <b>Не</b> добавляйте контроллеры Switch 2 в параметрах Bluetooth Windows – просто нажмите SYNC.",
  galleryTitle:"Другие экраны",
  g1alt:"Назначение кнопок с профилями", g1cap:"Свободное назначение кнопок – с профилями, турбо и макросами.",
  g2alt:"Настройки стиков и вибрации", g2cap:"Стики, триггеры и вибрация – для всех или для каждого контроллера.",
  g3alt:"Настройки прямо у контроллера", g3cap:"Все настройки прямо у каждого контроллера.",
  padsTitle:"Поддерживаемые контроллеры", padsLead:"По Bluetooth или USB-кабелю – до 8 одновременно.", padWired:"Проводные контроллеры HORI, PowerA, PDP",
  faqTitle:"Частые вопросы",
  q1:"N-Connect платный?", a1:"Нет. N-Connect бесплатный, без рекламы и с открытым исходным кодом (лицензия MIT).",
  q2:"Нужен ли Bluetooth?", a2:"Для беспроводных контроллеров – да, обычно хватает встроенного Bluetooth. Многие контроллеры работают и по USB-кабелю. Для большого числа контроллеров поможет хороший Bluetooth-адаптер.",
  q3:"Контроллер в Steam отображается дважды.", a3:"В N-Connect включите <b>Общие → Скрыть оригинальные контроллеры</b>, подтвердите запрос Windows и один раз перезапустите Steam.",
  q4:"Можно ли потом снова использовать контроллер на консоли?", a4:"Да. Просто ещё раз выполните сопряжение контроллеров Switch 2 с консолью – и они работают как обычно.",
  q5:"Работает ли без установки?", a5:"Да, в портативной версии ZIP. Но драйверы ViGEmBus и HidHide должны быть один раз установлены на ПК – установщик делает это автоматически.",
  q6:"Что-то не работает – что делать?", a6:"Щёлкните правой кнопкой по значку N-Connect справа внизу → <b>Открыть журнал</b> и приложите его содержимое к <a href=\"https://github.com/DevCatSKZ/N-Connect/issues\">сообщению о проблеме</a>.",
  legal:"N-Connect – неофициальный бесплатный проект с открытым исходным кодом от devcatskz, не связанный с Nintendo, Sony или Microsoft. Товарные знаки принадлежат их владельцам.",
  source:"Исходный код на GitHub", allReleases:"Все версии", bugs:"Сообщить о проблеме" },
ja: { name:"日本語", title:"N-Connect – コントローラーを PC にかんたん接続",
  navFeatures:"機能", navConnect:"接続", navControllers:"コントローラー", navFaq:"ヘルプ",
  tagline:"Nintendo・PlayStation・Xbox のコントローラーを PC で。つなぐだけで、どんなゲームでも遊べます。",
  download:"Windows 版をダウンロード", portable:"ポータブル版 (ZIP)", meta:"無料 · Windows 10 / 11 · 12 言語", version:" · バージョン ",
  smartscreen:"初回起動時に <b>「Windows によって PC が保護されました」</b> と表示されたら？ 高価な証明書のない新しいプログラムで起こります。<b>詳細情報 → 実行</b> をクリックしてください。N-Connect はオープンソースです。",
  shotAlt:"N-Connect：接続中のコントローラー、バッテリー残量、ボタン入力のリアルタイム表示",
  stepsTitle:"3 ステップで始める",
  s1h:"インストール", s1p:"セットアップをダウンロードして実行。必要なものはすべて自動でインストールされます。",
  s2h:"接続", s2p:"コントローラーの SYNC ボタンを押すだけ。N-Connect が自動で見つけます。",
  s3h:"プレイ", s3p:"すぐに使えます。Steam、Game Pass、エミュレーターなど、あらゆるゲームで。",
  featTitle:"N-Connect でできること", featLead:"多くのゲームは Xbox コントローラーしか認識しません。N-Connect はお使いのコントローラーをどのゲームでも使えるように変換し、便利な機能も備えています。",
  f1h:"どのゲームでも使える", f1p:"コントローラーは Xbox コントローラーとして、またはモーション操作付きの PlayStation コントローラーとして認識されます。",
  f2h:"最大 8 台", f2p:"プレイヤー 1、2、3… を自由に決められ、順番は記憶されます。",
  f3h:"バッテリーがひと目でわかる", f3p:"各コントローラーの残量を表示し、切れる前にお知らせします。",
  f4h:"ボタンを自由に割り当て", f4p:"キーボード、マウス、連射、ボタンの組み合わせにも。ゲームごとのプロファイル付き。",
  f5h:"動かして狙う", f5p:"モーションセンサーでカメラやマウスを操作。シューターに最適です。",
  f6h:"Switch と同じ Joy-Con", f6p:"2 本セットでも 1 本ずつでも、横持ちでも縦持ちでも。マウスとしても使えます。",
  f7h:"スティックのドリフトを解消", f7p:"スティックを測り直すだけ。コントローラー本体は変更されません。",
  f8h:"ワンクリックで更新", f8p:"新しいバージョンが出るとお知らせし、自動で更新します。",
  connectTitle:"コントローラーのつなぎ方",
  c1h:"Switch 2", c1p:"Pro コントローラー、Joy-Con 2、ゲームキューブ：<b>SYNC ボタン</b>を短く押します。Pro コントローラーとゲームキューブは USB ケーブルでも使えます。",
  c2h:"Switch", c2p:"Pro コントローラー、Joy-Con、ファミコン、スーファミ、64、メガドライブ：ランプが流れるまで <b>SYNC ボタン</b>を押します。",
  c3h:"Wii / Wii U", c3p:"赤い <b>SYNC ボタン</b>を押します。Wii リモコンは電池ボックス内、Wii U PRO コントローラーは裏側です。",
  c4h:"PlayStation", c4p:"DualShock 4 と DualSense は <b>Windows の Bluetooth 設定</b>で一度ペアリングするか、USB ケーブルで接続します。",
  c5h:"Xbox", c5p:"USB、Bluetooth、Xbox ワイヤレス アダプターでつなぐだけです。",
  connectNote:"次回からは<b>どれかのボタンを押すだけ</b>で接続します。Switch 2 のコントローラーは Windows の Bluetooth 設定に追加<b>しないで</b>ください。SYNC を押すだけで大丈夫です。",
  galleryTitle:"その他の画面",
  g1alt:"プロファイル付きのボタン割り当て", g1cap:"プロファイル、連射、マクロでボタンを自由に割り当て。",
  g2alt:"スティックと振動の設定", g2cap:"スティック、トリガー、振動を全体またはコントローラーごとに設定。",
  g3alt:"コントローラーごとの設定", g3cap:"すべての設定を各コントローラーから直接。",
  padsTitle:"対応コントローラー", padsLead:"Bluetooth または USB ケーブルで、同時に最大 8 台。", padWired:"HORI、PowerA、PDP の有線コントローラー",
  faqTitle:"よくある質問",
  q1:"N-Connect は有料ですか？", a1:"いいえ。N-Connect は無料・広告なしのオープンソースです（MIT ライセンス）。",
  q2:"Bluetooth は必要ですか？", a2:"ワイヤレスのコントローラーには必要です。通常は内蔵の Bluetooth で十分です。多くのコントローラーは USB ケーブルでも使えます。たくさん同時につなぐなら、性能のよい Bluetooth アダプターがおすすめです。",
  q3:"Steam でコントローラーが 2 つ表示されます。", a3:"N-Connect で <b>全般 → 元のコントローラーを隠す</b> をオンにし、Windows の確認を許可して Steam を一度再起動してください。",
  q4:"あとでまたゲーム機で使えますか？", a4:"はい。Switch 2 のコントローラーはゲーム機ともう一度ペアリングすれば、いつも通り使えます。",
  q5:"インストールなしで使えますか？", a5:"はい、ポータブル版 (ZIP) で使えます。ただし ViGEmBus と HidHide のドライバーは PC に一度インストールが必要です。セットアップなら自動で入ります。",
  q6:"うまく動かないときは？", a6:"右下の N-Connect アイコンを右クリック → <b>ログを開く</b> で内容を確認し、<a href=\"https://github.com/DevCatSKZ/N-Connect/issues\">不具合の報告</a>に添付してください。",
  legal:"N-Connect は devcatskz による非公式・無料のオープンソース プロジェクトで、Nintendo、Sony、Microsoft とは関係ありません。商標は各所有者に帰属します。",
  source:"GitHub のソースコード", allReleases:"すべてのバージョン", bugs:"問題を報告" },
zh: { name:"中文", title:"N-Connect – 轻松将手柄连接到电脑",

const order = ["de","en","es","fr","it","pt","nl","pl","ru","ja","zh","ko"];
const sel = document.getElementById("lang");
order.forEach(c => { const o = document.createElement("option"); o.value = c; o.textContent = I18N[c].name; sel.appendChild(o); });
let relTag = null;
function apply(code) {
  const t = I18N[code] || I18N.en, en = I18N.en;
  const get = k => t[k] !== undefined ? t[k] : en[k];
  document.documentElement.lang = code;
  document.querySelectorAll("[data-i]").forEach(el => { const v = get(el.dataset.i); if (v !== undefined) el.innerHTML = v; });
  document.querySelectorAll("[data-i-alt]").forEach(el => { const v = get(el.dataset.iAlt); if (v) el.alt = v; });
  document.title = get("title");
  document.getElementById("ver").textContent = relTag ? get("version") + relTag.replace(/^v/, "") : "";
  try { localStorage.setItem("nc-lang", code); } catch (e) {}
}
let saved = null; try { saved = localStorage.getItem("nc-lang"); } catch (e) {}
const nav = (navigator.language || "en").slice(0, 2).toLowerCase();
const start = saved && I18N[saved] ? saved : (I18N[nav] ? nav : "en");
sel.value = start; apply(start);
sel.addEventListener("change", () => apply(sel.value));

// Neueste Version: Download-Knöpfe direkt auf Setup bzw. portable ZIP zeigen lassen.
fetch("https://api.github.com/repos/DevCatSKZ/N-Connect/releases/latest")
  .then(r => r.json())
  .then(rel => {
    const assets = rel.assets || [];
    const setup = assets.find(a => /Setup.*\.exe$/i.test(a.name)) || assets.find(a => a.name.endsWith(".exe"));
    const zip = assets.find(a => /Portable.*\.zip$/i.test(a.name));
    if (setup) document.getElementById("dl").href = setup.browser_download_url;
    if (zip) document.getElementById("dlzip").href = zip.browser_download_url;
    relTag = rel.tag_name || null;
    apply(sel.value);
  })
  .catch(() => {});
</script>
