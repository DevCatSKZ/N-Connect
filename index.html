de: {"name":"Deutsch","title":"SKZ Connect – Controller für Windows, Android und Kodi","navPlat":"Plattformen","navFeatures":"Funktionen","navConnect":"Verbinden","navControllers":"Controller","navFaq":"Hilfe","tagline":"Nintendo-, PlayStation- und Xbox-Controller unter Windows in jedem Spiel nutzen. Switch-2-Controller auch unter Android und Kodi.","download":"Für Windows herunterladen","portable":"Portable Version (ZIP)","meta":"Kostenlos · Open Source · Windows 10 und 11","version":" · Version ","smartscreen":"SKZ Connect ist nicht code-signiert. Zeigt Windows beim ersten Start <b>„Der Computer wurde durch Windows geschützt“</b>, auf <b>Weitere Informationen → Trotzdem ausführen</b> klicken.","shotAlt":"SKZ Connect: Übersicht mit verbundenen Controllern, Akkustand und Live-Anzeige der Tasten","platTitle":"Plattformen","platLead":"Windows ist die Hauptplattform. Android und Kodi unterstützen Switch-2-Controller.","platWinH":"Windows 10 / 11","platWinP":"Alle unterstützten Controller als Xbox-360- oder DualShock-4-Controller – mit Tastenbelegung, Profilen je Spiel und Gyro.","platKodiH":"Kodi / LibreELEC","platKodiP":"Switch-2-Controller als Xbox-Controller für Kodi und RetroArch. Installation über das DevCatSKZ Repository mit automatischen Updates. Geprüft auf dem Raspberry Pi 4.","platKodiBtn":"Zum DevCatSKZ Repository","platAndH":"Android (Beta)","platAndP":"Switch-2-Controller als Xbox-Controller für Spiele, Emulatoren und Cloud-Gaming – über Shizuku oder Root, alternativ als Touch-Steuerung. Ab Android 8.","platAndBtn":"APK herunterladen (0.9.3)","platAndGuide":"Anleitung","stepsTitle":"In drei Schritten","s1h":"Installieren","s1p":"Setup starten. Die Treiber ViGEmBus und HidHide werden mitinstalliert.","s2h":"Verbinden","s2p":"SYNC-Taste am Controller drücken – SKZ Connect findet ihn.","s3h":"Spielen","s3p":"Der Controller funktioniert in Steam, im Game Pass, in Emulatoren und in anderen Spielen.","featTitle":"Funktionen","featLead":"Viele Spiele unter Windows unterstützen nur Xbox-Controller. SKZ Connect gibt jeden unterstützten Controller als Xbox- oder DualShock-4-Controller aus.","f1h":"Xbox oder DualShock 4","f1p":"Für alle oder je Controller; DualShock 4 mit Bewegungsdaten für Steam.","f2h":"Bis zu 8 Controller","f2p":"Feste Spielerplätze, Joy-Con einzeln oder als Paar.","f3h":"Tastenbelegung","f3p":"Tastatur, Maus, Turbo und Makros – mit Profilen, die je Spiel automatisch wechseln.","f4h":"Bewegungssteuerung","f4p":"Gyro als Stick oder Maus, Flick-Stick und DSU-Server für Emulatoren.","f5h":"Keine doppelten Controller","f5p":"HidHide versteckt die Originale vor Spielen und Steam.","f6h":"Werkzeuge","f6p":"Stick-Kalibrierung gegen Drift, Testseite, Akkuwarnung und Updates mit einem Klick.","connectTitle":"Controller verbinden (Windows)","c1h":"Switch 2","c1p":"Pro Controller 2, Joy-Con 2, GameCube: <b>SYNC-Taste</b> kurz drücken. Pro Controller und GameCube auch per USB.","c2h":"Switch","c2p":"Pro Controller, Joy-Con und NSO-Controller: <b>SYNC-Taste</b> drücken, bis die Lichter laufen.","c3h":"Wii und Wii U","c3p":"Rote <b>SYNC-Taste</b> drücken – im Batteriefach bzw. auf der Unterseite.","c4h":"PlayStation","c4p":"<b>PS + Share</b> (DualSense: <b>PS + Create</b>) halten, bis die Lichtleiste schnell blinkt, dann in SKZ Connect <b>Controller suchen …</b> – oder per USB-Kabel.","c5h":"Xbox","c5p":"Windows unterstützt Xbox-Controller direkt. SKZ Connect ergänzt Akkuanzeige und Tastenbelegung.","connectNote":"Danach genügt ein Tastendruck zum Wiederverbinden. Switch-2-Controller nicht in den Windows-Bluetooth-Einstellungen hinzufügen.","galleryTitle":"Ansichten","g1alt":"Tastenbelegung mit Profilen","g1cap":"Tastenbelegung mit Profilen, Turbo und Makros","g2alt":"Einstellungen für Sticks und Vibration","g2cap":"Sticks, Trigger und Vibration","g3alt":"Einstellungen an einem Controller","g3cap":"Einstellungen je Controller","padsTitle":"Unterstützte Controller","padsLead":"Unter Windows per Bluetooth oder USB, bis zu 8 gleichzeitig. Unter Android und Kodi: Switch-2-Controller.","padWired":"Kabel-Controller von HORI, PowerA, PDP","faqTitle":"Häufige Fragen","q1":"Was kostet SKZ Connect?","a1":"Nichts. SKZ Connect ist kostenlos, werbefrei und Open Source (MIT-Lizenz).","q2":"Brauche ich Bluetooth?","a2":"Für kabellose Controller ja; Switch-2-Controller brauchen Bluetooth LE. Viele Controller funktionieren auch per USB-Kabel.","q3":"Ein Controller erscheint in Steam doppelt.","a3":"In SKZ Connect <b>Allgemein → Ausgabe → Original-Controller verstecken</b> einschalten und Steam neu starten.","q4":"Kann ich den Controller weiter an der Konsole nutzen?","a4":"Ja. Ein Switch-2-Controller merkt sich ein Gerät: an der Konsole einmal neu koppeln, dann funktioniert er dort wie gewohnt.","q5":"Geht es ohne Installation?","a5":"Ja, mit der portablen ZIP-Version. Die Treiber ViGEmBus und HidHide müssen dann bereits installiert sein.","q6":"Welche Controller gehen unter Android?","a6":"Nur Switch-2-Controller (Pro Controller 2, Joy-Con 2, GameCube). Xbox- und PlayStation-Controller unterstützt Android selbst; Switch-1-Controller liefern dort meist nur Tasten und Sticks.","q7":"Etwas funktioniert nicht?","a7":"In SKZ Connect <b>Allgemein → Erweitert → Diagnose exportieren</b> und die Datei an eine <a href=\"https://github.com/DevCatSKZ/SKZ-Connect/issues\">Problemmeldung</a> anhängen.","legal":"Inoffizielles Open-Source-Projekt von devcatskz, nicht mit Nintendo, Sony oder Microsoft verbunden. Marken gehören ihren Inhabern.","source":"Quellcode","allReleases":"Alle Versionen","bugs":"Problem melden"},
en: {"name":"English","title":"SKZ Connect – controllers for Windows, Android and Kodi","navPlat":"Platforms","navFeatures":"Features","navConnect":"Connect","navControllers":"Controllers","navFaq":"Help","tagline":"Use Nintendo, PlayStation and Xbox controllers in any game on Windows. Switch 2 controllers also work on Android and Kodi.","download":"Download for Windows","portable":"Portable version (ZIP)","meta":"Free · Open source · Windows 10 and 11","version":" · Version ","smartscreen":"SKZ Connect is not code-signed. If Windows shows <b>“Windows protected your PC”</b> on first launch, click <b>More info → Run anyway</b>.","shotAlt":"SKZ Connect: overview of connected controllers with battery level and live button display","platTitle":"Platforms","platLead":"Windows is the main platform. Android and Kodi support Switch 2 controllers.","platWinH":"Windows 10 / 11","platWinP":"All supported controllers as Xbox 360 or DualShock 4 controllers – with remapping, per-game profiles and gyro.","platKodiH":"Kodi / LibreELEC","platKodiP":"Switch 2 controllers as Xbox controllers for Kodi and RetroArch. Install via the DevCatSKZ Repository with automatic updates. Tested on Raspberry Pi 4.","platKodiBtn":"Go to the DevCatSKZ Repository","platAndH":"Android (beta)","platAndP":"Switch 2 controllers as Xbox controllers for games, emulators and cloud gaming – via Shizuku or root, or as touch controls. Android 8 or later.","platAndBtn":"Download APK (0.9.3)","platAndGuide":"Guide","stepsTitle":"Three steps","s1h":"Install","s1p":"Run the setup. It also installs the ViGEmBus and HidHide drivers.","s2h":"Connect","s2p":"Press the SYNC button on the controller – SKZ Connect finds it.","s3h":"Play","s3p":"The controller works in Steam, Game Pass, emulators and other games.","featTitle":"Features","featLead":"Many Windows games only support Xbox controllers. SKZ Connect presents every supported controller as an Xbox or DualShock 4 controller.","f1h":"Xbox or DualShock 4","f1p":"For all controllers or per controller; DualShock 4 with motion data for Steam.","f2h":"Up to 8 controllers","f2p":"Fixed player slots, Joy-Con individually or as a pair.","f3h":"Remapping","f3p":"Keyboard, mouse, turbo and macros – with profiles that switch automatically per game.","f4h":"Motion controls","f4p":"Gyro as stick or mouse, flick stick and a DSU server for emulators.","f5h":"No duplicate controllers","f5p":"HidHide hides the original devices from games and Steam.","f6h":"Tools","f6p":"Stick calibration against drift, test page, low-battery warning and one-click updates.","connectTitle":"Connecting controllers (Windows)","c1h":"Switch 2","c1p":"Pro Controller 2, Joy-Con 2, GameCube: briefly press the <b>SYNC button</b>. Pro Controller and GameCube also work via USB.","c2h":"Switch","c2p":"Pro Controller, Joy-Con and NSO controllers: press the <b>SYNC button</b> until the lights run.","c3h":"Wii and Wii U","c3p":"Press the red <b>SYNC button</b> – in the battery compartment or on the underside.","c4h":"PlayStation","c4p":"Hold <b>PS + Share</b> (DualSense: <b>PS + Create</b>) until the light bar flashes quickly, then choose <b>Search for controllers …</b> in SKZ Connect – or connect via USB.","c5h":"Xbox","c5p":"Windows supports Xbox controllers natively. SKZ Connect adds battery display and remapping.","connectNote":"After that, a single button press reconnects. Do not add Switch 2 controllers in the Windows Bluetooth settings.","galleryTitle":"Screenshots","g1alt":"Button layout with profiles","g1cap":"Button layout with profiles, turbo and macros","g2alt":"Settings for sticks and rumble","g2cap":"Sticks, triggers and rumble","g3alt":"Settings on a single controller","g3cap":"Settings per controller","padsTitle":"Supported controllers","padsLead":"On Windows via Bluetooth or USB, up to 8 at once. On Android and Kodi: Switch 2 controllers.","padWired":"Wired controllers by HORI, PowerA, PDP","faqTitle":"Frequently asked questions","q1":"How much does SKZ Connect cost?","a1":"Nothing. SKZ Connect is free, ad-free and open source (MIT license).","q2":"Do I need Bluetooth?","a2":"For wireless controllers, yes; Switch 2 controllers need Bluetooth LE. Many controllers also work via USB cable.","q3":"A controller shows up twice in Steam.","a3":"In SKZ Connect, turn on <b>General → Output → Hide original controllers</b> and restart Steam.","q4":"Can I still use the controller on the console?","a4":"Yes. A Switch 2 controller remembers one device: pair it once again on the console and it works there as usual.","q5":"Does it work without installing?","a5":"Yes, with the portable ZIP version. The ViGEmBus and HidHide drivers must already be installed.","q6":"Which controllers work on Android?","a6":"Only Switch 2 controllers (Pro Controller 2, Joy-Con 2, GameCube). Android supports Xbox and PlayStation controllers itself; Switch 1 controllers usually provide only buttons and sticks there.","q7":"Something doesn't work?","a7":"In SKZ Connect, use <b>General → Advanced → Export diagnostics</b> and attach the file to a <a href=\"https://github.com/DevCatSKZ/SKZ-Connect/issues\">bug report</a>.","legal":"Unofficial open-source project by devcatskz, not affiliated with Nintendo, Sony or Microsoft. Trademarks belong to their owners.","source":"Source code","allReleases":"All versions","bugs":"Report a problem"},
es: {"name":"Español","title":"SKZ Connect – mandos para Windows, Android y Kodi","navPlat":"Plataformas","navFeatures":"Funciones","navConnect":"Conectar","navControllers":"Mandos","navFaq":"Ayuda","tagline":"Usa mandos de Nintendo, PlayStation y Xbox en cualquier juego en Windows. Los mandos de Switch 2 funcionan también en Android y Kodi.","download":"Descargar para Windows","portable":"Versión portable (ZIP)","meta":"Gratis · Código abierto · Windows 10 y 11","version":" · Versión ","smartscreen":"SKZ Connect no tiene firma de código. Si Windows muestra <b>«Windows protegió su PC»</b> al iniciarlo por primera vez, haz clic en <b>Más información → Ejecutar de todas formas</b>.","shotAlt":"SKZ Connect: vista general con los mandos conectados, nivel de batería y visualización de los botones en directo","platTitle":"Plataformas","platLead":"Windows es la plataforma principal. Android y Kodi admiten mandos de Switch 2.","platWinH":"Windows 10 / 11","platWinP":"Todos los mandos compatibles como mandos de Xbox 360 o DualShock 4, con asignación de botones, perfiles por juego y giroscopio.","platKodiH":"Kodi / LibreELEC","platKodiP":"Mandos de Switch 2 como mandos de Xbox para Kodi y RetroArch. Instalación desde el DevCatSKZ Repository con actualizaciones automáticas. Probado en Raspberry Pi 4.","platKodiBtn":"Ir al DevCatSKZ Repository","platAndH":"Android (beta)","platAndP":"Mandos de Switch 2 como mandos de Xbox para juegos, emuladores y juego en la nube, mediante Shizuku o root, o bien como control táctil. Android 8 o superior.","platAndBtn":"Descargar APK (0.9.3)","platAndGuide":"Guía","stepsTitle":"En tres pasos","s1h":"Instalar","s1p":"Ejecuta el instalador. Los controladores ViGEmBus y HidHide se instalan con él.","s2h":"Conectar","s2p":"Pulsa el botón SYNC del mando: SKZ Connect lo encuentra.","s3h":"Jugar","s3p":"El mando funciona en Steam, en Game Pass, en emuladores y en otros juegos.","featTitle":"Funciones","featLead":"Muchos juegos de Windows solo admiten mandos de Xbox. SKZ Connect presenta cada mando compatible como mando de Xbox o DualShock 4.","f1h":"Xbox o DualShock 4","f1p":"Para todos los mandos o por mando; DualShock 4 con datos de movimiento para Steam.","f2h":"Hasta 8 mandos","f2p":"Posiciones de jugador fijas, Joy-Con por separado o en pareja.","f3h":"Asignación de botones","f3p":"Teclado, ratón, turbo y macros, con perfiles que cambian automáticamente según el juego.","f4h":"Control por movimiento","f4p":"Giroscopio como stick o ratón, flick stick y servidor DSU para emuladores.","f5h":"Sin mandos duplicados","f5p":"HidHide oculta los originales a los juegos y a Steam.","f6h":"Herramientas","f6p":"Calibración de sticks contra el drift, página de prueba, aviso de batería y actualizaciones con un clic.","connectTitle":"Conectar mandos (Windows)","c1h":"Switch 2","c1p":"Pro Controller 2, Joy-Con 2, GameCube: pulsa brevemente el <b>botón SYNC</b>. Pro Controller y GameCube, también por USB.","c2h":"Switch","c2p":"Pro Controller, Joy-Con y mandos NSO: pulsa el <b>botón SYNC</b> hasta que las luces se muevan.","c3h":"Wii y Wii U","c3p":"Pulsa el <b>botón SYNC</b> rojo: en el compartimento de las pilas o en la parte inferior.","c4h":"PlayStation","c4p":"Mantén <b>PS + Share</b> (DualSense: <b>PS + Create</b>) hasta que la barra luminosa parpadee rápidamente y, después, usa <b>Buscar mandos …</b> en SKZ Connect, o conéctalo por cable USB.","c5h":"Xbox","c5p":"Windows admite los mandos de Xbox directamente. SKZ Connect añade la indicación de batería y la asignación de botones.","connectNote":"Después basta pulsar un botón para volver a conectar. No añadas los mandos de Switch 2 en la configuración de Bluetooth de Windows.","galleryTitle":"Vistas","g1alt":"Asignación de botones con perfiles","g1cap":"Asignación de botones con perfiles, turbo y macros","g2alt":"Ajustes de sticks y vibración","g2cap":"Sticks, gatillos y vibración","g3alt":"Ajustes de un mando","g3cap":"Ajustes por mando","padsTitle":"Mandos compatibles","padsLead":"En Windows por Bluetooth o USB, hasta 8 a la vez. En Android y Kodi: mandos de Switch 2.","padWired":"Mandos con cable de HORI, PowerA, PDP","faqTitle":"Preguntas frecuentes","q1":"¿Cuánto cuesta SKZ Connect?","a1":"Nada. SKZ Connect es gratuito, sin publicidad y de código abierto (licencia MIT).","q2":"¿Necesito Bluetooth?","a2":"Para mandos inalámbricos, sí; los mandos de Switch 2 necesitan Bluetooth LE. Muchos mandos también funcionan por cable USB.","q3":"Un mando aparece dos veces en Steam.","a3":"En SKZ Connect, activa <b>General → Salida → Ocultar mandos originales</b> y reinicia Steam.","q4":"¿Puedo seguir usando el mando en la consola?","a4":"Sí. Un mando de Switch 2 recuerda un solo dispositivo: vuelve a emparejarlo una vez con la consola y funcionará allí como siempre.","q5":"¿Funciona sin instalación?","a5":"Sí, con la versión portable en ZIP. En ese caso, los controladores ViGEmBus y HidHide ya deben estar instalados.","q6":"¿Qué mandos funcionan en Android?","a6":"Solo los mandos de Switch 2 (Pro Controller 2, Joy-Con 2, GameCube). Android admite por sí mismo los mandos de Xbox y PlayStation; los mandos de Switch 1 suelen ofrecer allí solo botones y sticks.","q7":"¿Algo no funciona?","a7":"En SKZ Connect, usa <b>General → Avanzado → Exportar diagnóstico</b> y adjunta el archivo a un <a href=\"https://github.com/DevCatSKZ/SKZ-Connect/issues\">informe de problema</a>.","legal":"Proyecto de código abierto no oficial de devcatskz, sin relación con Nintendo, Sony ni Microsoft. Las marcas pertenecen a sus propietarios.","source":"Código fuente","allReleases":"Todas las versiones","bugs":"Informar de un problema"},
fr: {"name":"Français","title":"SKZ Connect – manettes pour Windows, Android et Kodi","navPlat":"Plateformes","navFeatures":"Fonctions","navConnect":"Connexion","navControllers":"Manettes","navFaq":"Aide","tagline":"Utilisez des manettes Nintendo, PlayStation et Xbox dans n'importe quel jeu sous Windows. Les manettes Switch 2 fonctionnent aussi sous Android et Kodi.","download":"Télécharger pour Windows","portable":"Version portable (ZIP)","meta":"Gratuit · Open source · Windows 10 et 11","version":" · Version ","smartscreen":"SKZ Connect n'a pas de signature de code. Si Windows affiche <b>« Windows a protégé votre ordinateur »</b> au premier lancement, cliquez sur <b>Informations complémentaires → Exécuter quand même</b>.","shotAlt":"SKZ Connect : vue d'ensemble des manettes connectées avec niveau de batterie et affichage des boutons en direct","platTitle":"Plateformes","platLead":"Windows est la plateforme principale. Android et Kodi prennent en charge les manettes Switch 2.","platWinH":"Windows 10 / 11","platWinP":"Toutes les manettes prises en charge en tant que manettes Xbox 360 ou DualShock 4 – avec attribution des boutons, profils par jeu et gyroscope.","platKodiH":"Kodi / LibreELEC","platKodiP":"Manettes Switch 2 en tant que manettes Xbox pour Kodi et RetroArch. Installation via le DevCatSKZ Repository avec mises à jour automatiques. Testé sur Raspberry Pi 4.","platKodiBtn":"Vers le DevCatSKZ Repository","platAndH":"Android (bêta)","platAndP":"Manettes Switch 2 en tant que manettes Xbox pour les jeux, les émulateurs et le cloud gaming – via Shizuku ou root, ou en commandes tactiles. Android 8 ou plus récent.","platAndBtn":"Télécharger l'APK (0.9.3)","platAndGuide":"Guide","stepsTitle":"En trois étapes","s1h":"Installer","s1p":"Lancez le programme d'installation. Les pilotes ViGEmBus et HidHide sont installés avec lui.","s2h":"Connecter","s2p":"Appuyez sur le bouton SYNC de la manette – SKZ Connect la trouve.","s3h":"Jouer","s3p":"La manette fonctionne dans Steam, le Game Pass, les émulateurs et les autres jeux.","featTitle":"Fonctions","featLead":"Beaucoup de jeux sous Windows ne prennent en charge que les manettes Xbox. SKZ Connect présente chaque manette prise en charge comme une manette Xbox ou DualShock 4.","f1h":"Xbox ou DualShock 4","f1p":"Pour toutes les manettes ou par manette ; DualShock 4 avec données de mouvement pour Steam.","f2h":"Jusqu'à 8 manettes","f2p":"Places de joueur fixes, Joy-Con seuls ou en paire.","f3h":"Attribution des boutons","f3p":"Clavier, souris, turbo et macros – avec des profils qui changent automatiquement selon le jeu.","f4h":"Contrôle par mouvement","f4p":"Gyroscope comme stick ou souris, flick stick et serveur DSU pour les émulateurs.","f5h":"Pas de manettes en double","f5p":"HidHide masque les manettes d'origine aux jeux et à Steam.","f6h":"Outils","f6p":"Étalonnage des sticks contre la dérive, page de test, alerte de batterie faible et mises à jour en un clic.","connectTitle":"Connecter des manettes (Windows)","c1h":"Switch 2","c1p":"Pro Controller 2, Joy-Con 2, GameCube : appuyez brièvement sur le <b>bouton SYNC</b>. Pro Controller et GameCube aussi en USB.","c2h":"Switch","c2p":"Pro Controller, Joy-Con et manettes NSO : appuyez sur le <b>bouton SYNC</b> jusqu'à ce que les lumières défilent.","c3h":"Wii et Wii U","c3p":"Appuyez sur le <b>bouton SYNC</b> rouge – dans le compartiment à piles ou en dessous.","c4h":"PlayStation","c4p":"Maintenez <b>PS + Share</b> (DualSense : <b>PS + Create</b>) jusqu'à ce que la barre lumineuse clignote rapidement, puis choisissez <b>Chercher des manettes …</b> dans SKZ Connect – ou branchez-la en USB.","c5h":"Xbox","c5p":"Windows prend en charge les manettes Xbox nativement. SKZ Connect ajoute l'affichage de la batterie et l'attribution des boutons.","connectNote":"Ensuite, une pression sur un bouton suffit pour se reconnecter. N'ajoutez pas les manettes Switch 2 dans les paramètres Bluetooth de Windows.","galleryTitle":"Vues","g1alt":"Attribution des boutons avec profils","g1cap":"Attribution des boutons avec profils, turbo et macros","g2alt":"Paramètres des sticks et de la vibration","g2cap":"Sticks, gâchettes et vibration","g3alt":"Paramètres d'une manette","g3cap":"Paramètres par manette","padsTitle":"Manettes prises en charge","padsLead":"Sous Windows en Bluetooth ou USB, jusqu'à 8 à la fois. Sous Android et Kodi : manettes Switch 2.","padWired":"Manettes filaires HORI, PowerA, PDP","faqTitle":"Questions fréquentes","q1":"Combien coûte SKZ Connect ?","a1":"Rien. SKZ Connect est gratuit, sans publicité et open source (licence MIT).","q2":"Ai-je besoin du Bluetooth ?","a2":"Pour les manettes sans fil, oui ; les manettes Switch 2 nécessitent le Bluetooth LE. Beaucoup de manettes fonctionnent aussi par câble USB.","q3":"Une manette apparaît en double dans Steam.","a3":"Dans SKZ Connect, activez <b>Général → Sortie → Masquer les manettes d'origine</b> et redémarrez Steam.","q4":"Puis-je continuer à utiliser la manette sur la console ?","a4":"Oui. Une manette Switch 2 mémorise un seul appareil : appairez-la de nouveau une fois sur la console, puis elle y fonctionne comme d'habitude.","q5":"Est-ce que ça fonctionne sans installation ?","a5":"Oui, avec la version portable ZIP. Les pilotes ViGEmBus et HidHide doivent alors déjà être installés.","q6":"Quelles manettes fonctionnent sous Android ?","a6":"Uniquement les manettes Switch 2 (Pro Controller 2, Joy-Con 2, GameCube). Android prend lui-même en charge les manettes Xbox et PlayStation ; les manettes Switch 1 n'y fournissent généralement que les boutons et les sticks.","q7":"Quelque chose ne fonctionne pas ?","a7":"Dans SKZ Connect, utilisez <b>Général → Avancé → Exporter le diagnostic</b> et joignez le fichier à un <a href=\"https://github.com/DevCatSKZ/SKZ-Connect/issues\">signalement de problème</a>.","legal":"Projet open source non officiel de devcatskz, sans lien avec Nintendo, Sony ou Microsoft. Les marques appartiennent à leurs propriétaires.","source":"Code source","allReleases":"Toutes les versions","bugs":"Signaler un problème"},
it: {"name":"Italiano","title":"SKZ Connect – controller per Windows, Android e Kodi","navPlat":"Piattaforme","navFeatures":"Funzioni","navConnect":"Connessione","navControllers":"Controller","navFaq":"Aiuto","tagline":"Usa i controller Nintendo, PlayStation e Xbox in qualsiasi gioco su Windows. I controller Switch 2 funzionano anche su Android e Kodi.","download":"Scarica per Windows","portable":"Versione portable (ZIP)","meta":"Gratis · Open source · Windows 10 e 11","version":" · Versione ","smartscreen":"SKZ Connect non ha la firma del codice. Se al primo avvio Windows mostra <b>«PC protetto da Windows»</b>, fai clic su <b>Ulteriori informazioni → Esegui comunque</b>.","shotAlt":"SKZ Connect: panoramica dei controller connessi con livello della batteria e visualizzazione dei pulsanti in tempo reale","platTitle":"Piattaforme","platLead":"Windows è la piattaforma principale. Android e Kodi supportano i controller Switch 2.","platWinH":"Windows 10 / 11","platWinP":"Tutti i controller supportati come controller Xbox 360 o DualShock 4, con assegnazione dei pulsanti, profili per gioco e giroscopio.","platKodiH":"Kodi / LibreELEC","platKodiP":"Controller Switch 2 come controller Xbox per Kodi e RetroArch. Installazione dal DevCatSKZ Repository con aggiornamenti automatici. Testato su Raspberry Pi 4.","platKodiBtn":"Vai al DevCatSKZ Repository","platAndH":"Android (beta)","platAndP":"Controller Switch 2 come controller Xbox per giochi, emulatori e cloud gaming, tramite Shizuku o root, in alternativa come controllo touch. Android 8 o successivo.","platAndBtn":"Scarica APK (0.9.3)","platAndGuide":"Guida","stepsTitle":"In tre passi","s1h":"Installa","s1p":"Avvia il programma di installazione. Vengono installati anche i driver ViGEmBus e HidHide.","s2h":"Connetti","s2p":"Premi il pulsante SYNC del controller – SKZ Connect lo trova.","s3h":"Gioca","s3p":"Il controller funziona in Steam, Game Pass, emulatori e altri giochi.","featTitle":"Funzioni","featLead":"Molti giochi su Windows supportano solo i controller Xbox. SKZ Connect presenta ogni controller supportato come controller Xbox o DualShock 4.","f1h":"Xbox o DualShock 4","f1p":"Per tutti i controller o per singolo controller; DualShock 4 con dati di movimento per Steam.","f2h":"Fino a 8 controller","f2p":"Posti giocatore fissi, Joy-Con singoli o in coppia.","f3h":"Assegnazione dei pulsanti","f3p":"Tastiera, mouse, turbo e macro, con profili che cambiano automaticamente per ogni gioco.","f4h":"Controllo del movimento","f4p":"Giroscopio come stick o mouse, flick stick e server DSU per emulatori.","f5h":"Nessun controller doppio","f5p":"HidHide nasconde gli originali a giochi e Steam.","f6h":"Strumenti","f6p":"Calibrazione degli stick contro il drift, pagina di test, avviso di batteria scarica e aggiornamenti con un clic.","connectTitle":"Connessione dei controller (Windows)","c1h":"Switch 2","c1p":"Pro Controller 2, Joy-Con 2, GameCube: premi brevemente il <b>pulsante SYNC</b>. Pro Controller e GameCube anche via USB.","c2h":"Switch","c2p":"Pro Controller, Joy-Con e controller NSO: premi il <b>pulsante SYNC</b> finché le luci scorrono.","c3h":"Wii e Wii U","c3p":"Premi il <b>pulsante SYNC</b> rosso: nel vano batterie o sul lato inferiore.","c4h":"PlayStation","c4p":"Tieni premuto <b>PS + Share</b> (DualSense: <b>PS + Create</b>) finché la barra luminosa lampeggia rapidamente, poi scegli <b>Cerca controller …</b> in SKZ Connect, oppure collegalo via cavo USB.","c5h":"Xbox","c5p":"Windows supporta direttamente i controller Xbox. SKZ Connect aggiunge l'indicatore della batteria e l'assegnazione dei pulsanti.","connectNote":"Dopo basta premere un pulsante per riconnettersi. Non aggiungere i controller Switch 2 nelle impostazioni Bluetooth di Windows.","galleryTitle":"Schermate","g1alt":"Assegnazione dei pulsanti con profili","g1cap":"Assegnazione dei pulsanti con profili, turbo e macro","g2alt":"Impostazioni di stick e vibrazione","g2cap":"Stick, grilletti e vibrazione","g3alt":"Impostazioni di un controller","g3cap":"Impostazioni per controller","padsTitle":"Controller supportati","padsLead":"Su Windows via Bluetooth o USB, fino a 8 contemporaneamente. Su Android e Kodi: controller Switch 2.","padWired":"Controller cablati HORI, PowerA, PDP","faqTitle":"Domande frequenti","q1":"Quanto costa SKZ Connect?","a1":"Niente. SKZ Connect è gratuito, senza pubblicità e open source (licenza MIT).","q2":"Mi serve il Bluetooth?","a2":"Per i controller wireless sì; i controller Switch 2 richiedono Bluetooth LE. Molti controller funzionano anche via cavo USB.","q3":"Un controller appare due volte in Steam.","a3":"In SKZ Connect attiva <b>Generale → Output → Nascondi i controller originali</b> e riavvia Steam.","q4":"Posso continuare a usare il controller sulla console?","a4":"Sì. Un controller Switch 2 memorizza un solo dispositivo: associalo di nuovo una volta alla console e lì funzionerà come sempre.","q5":"Funziona senza installazione?","a5":"Sì, con la versione portable ZIP. In questo caso i driver ViGEmBus e HidHide devono essere già installati.","q6":"Quali controller funzionano su Android?","a6":"Solo i controller Switch 2 (Pro Controller 2, Joy-Con 2, GameCube). Android supporta da sé i controller Xbox e PlayStation; i controller Switch 1 lì forniscono di solito solo pulsanti e stick.","q7":"Qualcosa non funziona?","a7":"In SKZ Connect usa <b>Generale → Avanzate → Esporta diagnostica</b> e allega il file a una <a href=\"https://github.com/DevCatSKZ/SKZ-Connect/issues\">segnalazione</a>.","legal":"Progetto open source non ufficiale di devcatskz, non affiliato a Nintendo, Sony o Microsoft. I marchi appartengono ai rispettivi proprietari.","source":"Codice sorgente","allReleases":"Tutte le versioni","bugs":"Segnala un problema"},
pt: {"name":"Português","title":"SKZ Connect – comandos para Windows, Android e Kodi","navPlat":"Plataformas","navFeatures":"Funções","navConnect":"Ligar","navControllers":"Comandos","navFaq":"Ajuda","tagline":"Use comandos Nintendo, PlayStation e Xbox em qualquer jogo no Windows. Os comandos Switch 2 também funcionam no Android e no Kodi.","download":"Transferir para Windows","portable":"Versão portátil (ZIP)","meta":"Gratuito · Open source · Windows 10 e 11","version":" · Versão ","smartscreen":"O SKZ Connect não tem assinatura de código. Se o Windows mostrar <b>«O Windows protegeu o seu PC»</b> no primeiro arranque, clique em <b>Mais informações → Executar mesmo assim</b>.","shotAlt":"SKZ Connect: vista geral dos comandos ligados com nível de bateria e apresentação dos botões em tempo real","platTitle":"Plataformas","platLead":"O Windows é a plataforma principal. O Android e o Kodi suportam comandos Switch 2.","platWinH":"Windows 10 / 11","platWinP":"Todos os comandos suportados como comandos Xbox 360 ou DualShock 4 – com atribuição de botões, perfis por jogo e giroscópio.","platKodiH":"Kodi / LibreELEC","platKodiP":"Comandos Switch 2 como comandos Xbox para Kodi e RetroArch. Instalação pelo DevCatSKZ Repository com atualizações automáticas. Testado no Raspberry Pi 4.","platKodiBtn":"Ir para o DevCatSKZ Repository","platAndH":"Android (beta)","platAndP":"Comandos Switch 2 como comandos Xbox para jogos, emuladores e jogos na nuvem – através do Shizuku ou root, ou em alternativa como controlo tátil. Android 8 ou mais recente.","platAndBtn":"Transferir APK (0.9.3)","platAndGuide":"Guia","stepsTitle":"Em três passos","s1h":"Instalar","s1p":"Execute o instalador. Os controladores ViGEmBus e HidHide são instalados em conjunto.","s2h":"Ligar","s2p":"Prima o botão SYNC do comando – o SKZ Connect encontra-o.","s3h":"Jogar","s3p":"O comando funciona no Steam, no Game Pass, em emuladores e noutros jogos.","featTitle":"Funções","featLead":"Muitos jogos no Windows só suportam comandos Xbox. O SKZ Connect apresenta cada comando suportado como comando Xbox ou DualShock 4.","f1h":"Xbox ou DualShock 4","f1p":"Para todos os comandos ou por comando; DualShock 4 com dados de movimento para o Steam.","f2h":"Até 8 comandos","f2p":"Lugares de jogador fixos, Joy-Con individualmente ou em par.","f3h":"Atribuição de botões","f3p":"Teclado, rato, turbo e macros – com perfis que mudam automaticamente consoante o jogo.","f4h":"Controlo por movimento","f4p":"Giroscópio como stick ou rato, flick stick e servidor DSU para emuladores.","f5h":"Sem comandos duplicados","f5p":"O HidHide oculta os originais dos jogos e do Steam.","f6h":"Ferramentas","f6p":"Calibração dos sticks contra o drift, página de teste, aviso de bateria fraca e atualizações com um clique.","connectTitle":"Ligar comandos (Windows)","c1h":"Switch 2","c1p":"Pro Controller 2, Joy-Con 2, GameCube: prima brevemente o <b>botão SYNC</b>. Pro Controller e GameCube também por USB.","c2h":"Switch","c2p":"Pro Controller, Joy-Con e comandos NSO: prima o <b>botão SYNC</b> até as luzes correrem.","c3h":"Wii e Wii U","c3p":"Prima o <b>botão SYNC</b> vermelho – no compartimento das pilhas ou na parte inferior.","c4h":"PlayStation","c4p":"Mantenha <b>PS + Share</b> (DualSense: <b>PS + Create</b>) premidos até a barra de luz piscar rapidamente e, depois, escolha <b>Procurar comandos …</b> no SKZ Connect – ou ligue por cabo USB.","c5h":"Xbox","c5p":"O Windows suporta comandos Xbox diretamente. O SKZ Connect acrescenta a indicação da bateria e a atribuição de botões.","connectNote":"Depois basta premir um botão para voltar a ligar. Não adicione comandos Switch 2 nas definições de Bluetooth do Windows.","galleryTitle":"Vistas","g1alt":"Atribuição de botões com perfis","g1cap":"Atribuição de botões com perfis, turbo e macros","g2alt":"Definições de sticks e vibração","g2cap":"Sticks, gatilhos e vibração","g3alt":"Definições de um comando","g3cap":"Definições por comando","padsTitle":"Comandos suportados","padsLead":"No Windows por Bluetooth ou USB, até 8 em simultâneo. No Android e no Kodi: comandos Switch 2.","padWired":"Comandos com fios HORI, PowerA, PDP","faqTitle":"Perguntas frequentes","q1":"Quanto custa o SKZ Connect?","a1":"Nada. O SKZ Connect é gratuito, sem publicidade e open source (licença MIT).","q2":"Preciso de Bluetooth?","a2":"Para comandos sem fios, sim; os comandos Switch 2 precisam de Bluetooth LE. Muitos comandos também funcionam por cabo USB.","q3":"Um comando aparece duas vezes no Steam.","a3":"No SKZ Connect, ative <b>Geral → Saída → Ocultar comandos originais</b> e reinicie o Steam.","q4":"Posso continuar a usar o comando na consola?","a4":"Sim. Um comando Switch 2 memoriza um único dispositivo: emparelhe-o novamente uma vez com a consola e funcionará aí como habitualmente.","q5":"Funciona sem instalação?","a5":"Sim, com a versão portátil ZIP. Nesse caso, os controladores ViGEmBus e HidHide já têm de estar instalados.","q6":"Que comandos funcionam no Android?","a6":"Apenas comandos Switch 2 (Pro Controller 2, Joy-Con 2, GameCube). O próprio Android suporta comandos Xbox e PlayStation; os comandos Switch 1 normalmente só fornecem aí botões e sticks.","q7":"Algo não funciona?","a7":"No SKZ Connect, use <b>Geral → Avançado → Exportar diagnóstico</b> e anexe o ficheiro a um <a href=\"https://github.com/DevCatSKZ/SKZ-Connect/issues\">relatório de problema</a>.","legal":"Projeto open source não oficial de devcatskz, sem ligação à Nintendo, Sony ou Microsoft. As marcas pertencem aos respetivos proprietários.","source":"Código-fonte","allReleases":"Todas as versões","bugs":"Comunicar um problema"},
nl: {"name":"Nederlands","title":"SKZ Connect – controllers voor Windows, Android en Kodi","navPlat":"Platforms","navFeatures":"Functies","navConnect":"Verbinden","navControllers":"Controllers","navFaq":"Hulp","tagline":"Gebruik Nintendo-, PlayStation- en Xbox-controllers in elke game op Windows. Switch 2-controllers werken ook op Android en Kodi.","download":"Downloaden voor Windows","portable":"Draagbare versie (ZIP)","meta":"Gratis · Open source · Windows 10 en 11","version":" · Versie ","smartscreen":"SKZ Connect heeft geen codehandtekening. Toont Windows bij de eerste start <b>„Uw pc wordt beschermd”</b>, klik dan op <b>Meer informatie → Toch uitvoeren</b>.","shotAlt":"SKZ Connect: overzicht van verbonden controllers met accuniveau en live weergave van de knoppen","platTitle":"Platforms","platLead":"Windows is het hoofdplatform. Android en Kodi ondersteunen Switch 2-controllers.","platWinH":"Windows 10 / 11","platWinP":"Alle ondersteunde controllers als Xbox 360- of DualShock 4-controller – met knoptoewijzing, profielen per game en gyroscoop.","platKodiH":"Kodi / LibreELEC","platKodiP":"Switch 2-controllers als Xbox-controllers voor Kodi en RetroArch. Installatie via de DevCatSKZ Repository met automatische updates. Getest op de Raspberry Pi 4.","platKodiBtn":"Naar de DevCatSKZ Repository","platAndH":"Android (bèta)","platAndP":"Switch 2-controllers als Xbox-controllers voor games, emulators en cloudgaming – via Shizuku of root, of als aanraakbediening. Vanaf Android 8.","platAndBtn":"APK downloaden (0.9.3)","platAndGuide":"Handleiding","stepsTitle":"In drie stappen","s1h":"Installeren","s1p":"Start de setup. De stuurprogramma's ViGEmBus en HidHide worden meegeïnstalleerd.","s2h":"Verbinden","s2p":"Druk op de SYNC-knop van de controller – SKZ Connect vindt hem.","s3h":"Spelen","s3p":"De controller werkt in Steam, Game Pass, emulators en andere games.","featTitle":"Functies","featLead":"Veel games op Windows ondersteunen alleen Xbox-controllers. SKZ Connect geeft elke ondersteunde controller door als Xbox- of DualShock 4-controller.","f1h":"Xbox of DualShock 4","f1p":"Voor alle controllers of per controller; DualShock 4 met bewegingsgegevens voor Steam.","f2h":"Tot 8 controllers","f2p":"Vaste spelerplekken, Joy-Con los of als paar.","f3h":"Knoptoewijzing","f3p":"Toetsenbord, muis, turbo en macro's – met profielen die per game automatisch wisselen.","f4h":"Bewegingsbesturing","f4p":"Gyroscoop als stick of muis, flick stick en DSU-server voor emulators.","f5h":"Geen dubbele controllers","f5p":"HidHide verbergt de originelen voor games en Steam.","f6h":"Hulpmiddelen","f6p":"Stickkalibratie tegen drift, testpagina, waarschuwing bij lage accu en updates met één klik.","connectTitle":"Controllers verbinden (Windows)","c1h":"Switch 2","c1p":"Pro Controller 2, Joy-Con 2, GameCube: druk kort op de <b>SYNC-knop</b>. Pro Controller en GameCube ook via USB.","c2h":"Switch","c2p":"Pro Controller, Joy-Con en NSO-controllers: druk op de <b>SYNC-knop</b> tot de lampjes lopen.","c3h":"Wii en Wii U","c3p":"Druk op de rode <b>SYNC-knop</b> – in het batterijvak of aan de onderkant.","c4h":"PlayStation","c4p":"Houd <b>PS + Share</b> (DualSense: <b>PS + Create</b>) ingedrukt tot de lichtbalk snel knippert en kies dan in SKZ Connect <b>Controllers zoeken …</b> – of sluit hem aan met een USB-kabel.","c5h":"Xbox","c5p":"Windows ondersteunt Xbox-controllers rechtstreeks. SKZ Connect voegt accuweergave en knoptoewijzing toe.","connectNote":"Daarna volstaat één knopdruk om opnieuw te verbinden. Voeg Switch 2-controllers niet toe in de Bluetooth-instellingen van Windows.","galleryTitle":"Weergaven","g1alt":"Knoptoewijzing met profielen","g1cap":"Knoptoewijzing met profielen, turbo en macro's","g2alt":"Instellingen voor sticks en trilling","g2cap":"Sticks, triggers en trilling","g3alt":"Instellingen van een controller","g3cap":"Instellingen per controller","padsTitle":"Ondersteunde controllers","padsLead":"Op Windows via Bluetooth of USB, tot 8 tegelijk. Op Android en Kodi: Switch 2-controllers.","padWired":"Bedrade controllers van HORI, PowerA, PDP","faqTitle":"Veelgestelde vragen","q1":"Wat kost SKZ Connect?","a1":"Niets. SKZ Connect is gratis, zonder reclame en open source (MIT-licentie).","q2":"Heb ik Bluetooth nodig?","a2":"Voor draadloze controllers wel; Switch 2-controllers hebben Bluetooth LE nodig. Veel controllers werken ook via een USB-kabel.","q3":"Een controller verschijnt dubbel in Steam.","a3":"Zet in SKZ Connect <b>Algemeen → Uitvoer → Originele controllers verbergen</b> aan en start Steam opnieuw.","q4":"Kan ik de controller nog op de console gebruiken?","a4":"Ja. Een Switch 2-controller onthoudt één apparaat: koppel hem één keer opnieuw met de console, dan werkt hij daar zoals gewoonlijk.","q5":"Werkt het zonder installatie?","a5":"Ja, met de draagbare ZIP-versie. De stuurprogramma's ViGEmBus en HidHide moeten dan al geïnstalleerd zijn.","q6":"Welke controllers werken op Android?","a6":"Alleen Switch 2-controllers (Pro Controller 2, Joy-Con 2, GameCube). Xbox- en PlayStation-controllers ondersteunt Android zelf; Switch 1-controllers leveren daar meestal alleen knoppen en sticks.","q7":"Werkt iets niet?","a7":"Kies in SKZ Connect <b>Algemeen → Geavanceerd → Diagnose exporteren</b> en voeg het bestand toe aan een <a href=\"https://github.com/DevCatSKZ/SKZ-Connect/issues\">probleemmelding</a>.","legal":"Onofficieel open-sourceproject van devcatskz, niet verbonden met Nintendo, Sony of Microsoft. Merken zijn eigendom van hun eigenaren.","source":"Broncode","allReleases":"Alle versies","bugs":"Probleem melden"},
pl: {"name":"Polski","title":"SKZ Connect – kontrolery dla Windows, Androida i Kodi","navPlat":"Platformy","navFeatures":"Funkcje","navConnect":"Łączenie","navControllers":"Kontrolery","navFaq":"Pomoc","tagline":"Używaj kontrolerów Nintendo, PlayStation i Xbox w każdej grze w systemie Windows. Kontrolery Switch 2 działają także na Androidzie i w Kodi.","download":"Pobierz dla Windows","portable":"Wersja przenośna (ZIP)","meta":"Za darmo · Open source · Windows 10 i 11","version":" · Wersja ","smartscreen":"SKZ Connect nie jest podpisany cyfrowo. Jeśli przy pierwszym uruchomieniu Windows pokaże <b>„System Windows ochronił ten komputer”</b>, kliknij <b>Więcej informacji → Uruchom mimo to</b>.","shotAlt":"SKZ Connect: przegląd połączonych kontrolerów z poziomem baterii i podglądem przycisków na żywo","platTitle":"Platformy","platLead":"Windows to główna platforma. Android i Kodi obsługują kontrolery Switch 2.","platWinH":"Windows 10 / 11","platWinP":"Wszystkie obsługiwane kontrolery jako kontrolery Xbox 360 lub DualShock 4 – z przypisaniem przycisków, profilami dla poszczególnych gier i żyroskopem.","platKodiH":"Kodi / LibreELEC","platKodiP":"Kontrolery Switch 2 jako kontrolery Xbox dla Kodi i RetroArch. Instalacja z DevCatSKZ Repository z automatycznymi aktualizacjami. Sprawdzone na Raspberry Pi 4.","platKodiBtn":"Do DevCatSKZ Repository","platAndH":"Android (beta)","platAndP":"Kontrolery Switch 2 jako kontrolery Xbox do gier, emulatorów i grania w chmurze – przez Shizuku lub root, alternatywnie jako sterowanie dotykowe. Od Androida 8.","platAndBtn":"Pobierz APK (0.9.3)","platAndGuide":"Instrukcja","stepsTitle":"W trzech krokach","s1h":"Zainstaluj","s1p":"Uruchom instalator. Sterowniki ViGEmBus i HidHide zostaną zainstalowane razem z nim.","s2h":"Połącz","s2p":"Naciśnij przycisk SYNC na kontrolerze – SKZ Connect go znajdzie.","s3h":"Graj","s3p":"Kontroler działa w Steam, Game Pass, emulatorach i innych grach.","featTitle":"Funkcje","featLead":"Wiele gier w systemie Windows obsługuje tylko kontrolery Xbox. SKZ Connect udostępnia każdy obsługiwany kontroler jako kontroler Xbox lub DualShock 4.","f1h":"Xbox lub DualShock 4","f1p":"Dla wszystkich lub dla każdego kontrolera osobno; DualShock 4 z danymi ruchu dla Steam.","f2h":"Do 8 kontrolerów","f2p":"Stałe miejsca graczy, Joy-Con pojedynczo lub w parze.","f3h":"Przypisanie przycisków","f3p":"Klawiatura, mysz, turbo i makra – z profilami przełączanymi automatycznie dla każdej gry.","f4h":"Sterowanie ruchem","f4p":"Żyroskop jako gałka lub mysz, flick stick i serwer DSU dla emulatorów.","f5h":"Bez podwójnych kontrolerów","f5p":"HidHide ukrywa oryginalne urządzenia przed grami i Steam.","f6h":"Narzędzia","f6p":"Kalibracja gałek przeciw dryfowi, strona testowa, ostrzeżenie o niskim poziomie baterii i aktualizacje jednym kliknięciem.","connectTitle":"Łączenie kontrolerów (Windows)","c1h":"Switch 2","c1p":"Pro Controller 2, Joy-Con 2, GameCube: krótko naciśnij <b>przycisk SYNC</b>. Pro Controller i GameCube także przez USB.","c2h":"Switch","c2p":"Pro Controller, Joy-Con i kontrolery NSO: naciśnij <b>przycisk SYNC</b>, aż światełka zaczną biec.","c3h":"Wii i Wii U","c3p":"Naciśnij czerwony <b>przycisk SYNC</b> – w komorze baterii lub na spodzie.","c4h":"PlayStation","c4p":"Przytrzymaj <b>PS + Share</b> (DualSense: <b>PS + Create</b>), aż pasek świetlny zacznie szybko migać, a następnie w SKZ Connect wybierz <b>Szukaj kontrolerów …</b> – lub podłącz kablem USB.","c5h":"Xbox","c5p":"Windows obsługuje kontrolery Xbox bezpośrednio. SKZ Connect dodaje wskaźnik baterii i przypisanie przycisków.","connectNote":"Później do ponownego połączenia wystarczy naciśnięcie przycisku. Nie dodawaj kontrolerów Switch 2 w ustawieniach Bluetooth systemu Windows.","galleryTitle":"Widoki","g1alt":"Przypisanie przycisków z profilami","g1cap":"Przypisanie przycisków z profilami, turbo i makrami","g2alt":"Ustawienia gałek i wibracji","g2cap":"Gałki, spusty i wibracje","g3alt":"Ustawienia pojedynczego kontrolera","g3cap":"Ustawienia dla każdego kontrolera","padsTitle":"Obsługiwane kontrolery","padsLead":"W systemie Windows przez Bluetooth lub USB, do 8 naraz. Na Androidzie i w Kodi: kontrolery Switch 2.","padWired":"Kontrolery przewodowe HORI, PowerA, PDP","faqTitle":"Częste pytania","q1":"Ile kosztuje SKZ Connect?","a1":"Nic. SKZ Connect jest darmowy, bez reklam i open source (licencja MIT).","q2":"Czy potrzebuję Bluetooth?","a2":"Dla kontrolerów bezprzewodowych tak; kontrolery Switch 2 wymagają Bluetooth LE. Wiele kontrolerów działa też przez kabel USB.","q3":"Kontroler pojawia się w Steam dwa razy.","a3":"W SKZ Connect włącz <b>Ogólne → Wyjście → Ukryj oryginalne kontrolery</b> i uruchom ponownie Steam.","q4":"Czy mogę dalej używać kontrolera na konsoli?","a4":"Tak. Kontroler Switch 2 zapamiętuje jedno urządzenie: sparuj go raz ponownie z konsolą, a będzie tam działał jak zwykle.","q5":"Czy działa bez instalacji?","a5":"Tak, w wersji przenośnej ZIP. Sterowniki ViGEmBus i HidHide muszą być wtedy już zainstalowane.","q6":"Które kontrolery działają na Androidzie?","a6":"Tylko kontrolery Switch 2 (Pro Controller 2, Joy-Con 2, GameCube). Kontrolery Xbox i PlayStation Android obsługuje sam; kontrolery Switch 1 przekazują tam zwykle tylko przyciski i gałki.","q7":"Coś nie działa?","a7":"W SKZ Connect wybierz <b>Ogólne → Zaawansowane → Eksportuj diagnostykę</b> i dołącz plik do <a href=\"https://github.com/DevCatSKZ/SKZ-Connect/issues\">zgłoszenia problemu</a>.","legal":"Nieoficjalny projekt open source autorstwa devcatskz, niezwiązany z Nintendo, Sony ani Microsoft. Znaki towarowe należą do ich właścicieli.","source":"Kod źródłowy","allReleases":"Wszystkie wersje","bugs":"Zgłoś problem"},
ru: {"name":"Русский","title":"SKZ Connect – контроллеры для Windows, Android и Kodi","navPlat":"Платформы","navFeatures":"Возможности","navConnect":"Подключение","navControllers":"Контроллеры","navFaq":"Помощь","tagline":"Используйте контроллеры Nintendo, PlayStation и Xbox в любой игре на Windows. Контроллеры Switch 2 работают также на Android и в Kodi.","download":"Скачать для Windows","portable":"Портативная версия (ZIP)","meta":"Бесплатно · Открытый исходный код · Windows 10 и 11","version":" · Версия ","smartscreen":"SKZ Connect не имеет цифровой подписи. Если при первом запуске Windows показывает <b>«Система Windows защитила ваш компьютер»</b>, нажмите <b>Подробнее → Выполнить в любом случае</b>.","shotAlt":"SKZ Connect: обзор подключённых контроллеров с уровнем заряда и отображением кнопок в реальном времени","platTitle":"Платформы","platLead":"Windows – основная платформа. Android и Kodi поддерживают контроллеры Switch 2.","platWinH":"Windows 10 / 11","platWinP":"Все поддерживаемые контроллеры как контроллеры Xbox 360 или DualShock 4 – с назначением кнопок, профилями для отдельных игр и гироскопом.","platKodiH":"Kodi / LibreELEC","platKodiP":"Контроллеры Switch 2 как контроллеры Xbox для Kodi и RetroArch. Установка через DevCatSKZ Repository с автоматическими обновлениями. Проверено на Raspberry Pi 4.","platKodiBtn":"В DevCatSKZ Repository","platAndH":"Android (бета)","platAndP":"Контроллеры Switch 2 как контроллеры Xbox для игр, эмуляторов и облачного гейминга – через Shizuku или root, либо как сенсорное управление. Android 8 и новее.","platAndBtn":"Скачать APK (0.9.3)","platAndGuide":"Инструкция","stepsTitle":"В три шага","s1h":"Установить","s1p":"Запустите установщик. Драйверы ViGEmBus и HidHide устанавливаются вместе с ним.","s2h":"Подключить","s2p":"Нажмите кнопку SYNC на контроллере – SKZ Connect найдёт его.","s3h":"Играть","s3p":"Контроллер работает в Steam, Game Pass, эмуляторах и других играх.","featTitle":"Возможности","featLead":"Многие игры на Windows поддерживают только контроллеры Xbox. SKZ Connect представляет каждый поддерживаемый контроллер как контроллер Xbox или DualShock 4.","f1h":"Xbox или DualShock 4","f1p":"Для всех или для каждого контроллера отдельно; DualShock 4 с данными движения для Steam.","f2h":"До 8 контроллеров","f2p":"Фиксированные места игроков, Joy-Con по одному или парой.","f3h":"Назначение кнопок","f3p":"Клавиатура, мышь, турбо и макросы – с профилями, которые автоматически переключаются для каждой игры.","f4h":"Управление движением","f4p":"Гироскоп как стик или мышь, flick-стик и DSU-сервер для эмуляторов.","f5h":"Без дублирования контроллеров","f5p":"HidHide скрывает оригинальные устройства от игр и Steam.","f6h":"Инструменты","f6p":"Калибровка стиков против дрейфа, тестовая страница, предупреждение о низком заряде и обновления в один клик.","connectTitle":"Подключение контроллеров (Windows)","c1h":"Switch 2","c1p":"Pro Controller 2, Joy-Con 2, GameCube: коротко нажмите <b>кнопку SYNC</b>. Pro Controller и GameCube также по USB.","c2h":"Switch","c2p":"Pro Controller, Joy-Con и контроллеры NSO: нажмите <b>кнопку SYNC</b>, пока огни не побегут.","c3h":"Wii и Wii U","c3p":"Нажмите красную <b>кнопку SYNC</b> – в батарейном отсеке или на нижней стороне.","c4h":"PlayStation","c4p":"Удерживайте <b>PS + Share</b> (DualSense: <b>PS + Create</b>), пока световая панель не начнёт быстро мигать, затем в SKZ Connect выберите <b>Найти контроллеры …</b> – или подключите USB-кабелем.","c5h":"Xbox","c5p":"Windows поддерживает контроллеры Xbox напрямую. SKZ Connect добавляет индикатор заряда и назначение кнопок.","connectNote":"После этого для повторного подключения достаточно нажать кнопку. Не добавляйте контроллеры Switch 2 в параметрах Bluetooth Windows.","galleryTitle":"Экраны","g1alt":"Назначение кнопок с профилями","g1cap":"Назначение кнопок с профилями, турбо и макросами","g2alt":"Настройки стиков и вибрации","g2cap":"Стики, триггеры и вибрация","g3alt":"Настройки отдельного контроллера","g3cap":"Настройки для каждого контроллера","padsTitle":"Поддерживаемые контроллеры","padsLead":"На Windows по Bluetooth или USB, до 8 одновременно. На Android и в Kodi: контроллеры Switch 2.","padWired":"Проводные контроллеры HORI, PowerA, PDP","faqTitle":"Частые вопросы","q1":"Сколько стоит SKZ Connect?","a1":"Ничего. SKZ Connect бесплатный, без рекламы и с открытым исходным кодом (лицензия MIT).","q2":"Нужен ли Bluetooth?","a2":"Для беспроводных контроллеров – да; контроллерам Switch 2 нужен Bluetooth LE. Многие контроллеры работают и по USB-кабелю.","q3":"Контроллер отображается в Steam дважды.","a3":"В SKZ Connect включите <b>Общие → Вывод → Скрыть оригинальные контроллеры</b> и перезапустите Steam.","q4":"Можно ли и дальше использовать контроллер на консоли?","a4":"Да. Контроллер Switch 2 запоминает одно устройство: один раз заново выполните сопряжение с консолью, и он будет работать там как обычно.","q5":"Работает ли без установки?","a5":"Да, в портативной версии ZIP. Драйверы ViGEmBus и HidHide в этом случае должны быть уже установлены.","q6":"Какие контроллеры работают на Android?","a6":"Только контроллеры Switch 2 (Pro Controller 2, Joy-Con 2, GameCube). Контроллеры Xbox и PlayStation Android поддерживает сам; контроллеры Switch 1 там обычно передают только кнопки и стики.","q7":"Что-то не работает?","a7":"В SKZ Connect выберите <b>Общие → Дополнительно → Экспорт диагностики</b> и приложите файл к <a href=\"https://github.com/DevCatSKZ/SKZ-Connect/issues\">сообщению о проблеме</a>.","legal":"Неофициальный проект с открытым исходным кодом от devcatskz, не связанный с Nintendo, Sony или Microsoft. Товарные знаки принадлежат их владельцам.","source":"Исходный код","allReleases":"Все версии","bugs":"Сообщить о проблеме"},
ja: {"name":"日本語","title":"SKZ Connect – Windows・Android・Kodi 向けコントローラー","navPlat":"プラットフォーム","navFeatures":"機能","navConnect":"接続","navControllers":"コントローラー","navFaq":"ヘルプ","tagline":"Nintendo・PlayStation・Xbox のコントローラーを Windows のどのゲームでも使えます。Switch 2 のコントローラーは Android と Kodi にも対応しています。","download":"Windows 版をダウンロード","portable":"ポータブル版 (ZIP)","meta":"無料 · オープンソース · Windows 10 / 11","version":" · バージョン ","smartscreen":"SKZ Connect はコード署名されていません。初回起動時に <b>「Windows によって PC が保護されました」</b> と表示された場合は、<b>詳細情報 → 実行</b> をクリックしてください。","shotAlt":"SKZ Connect：接続中のコントローラー、バッテリー残量、ボタン入力のリアルタイム表示","platTitle":"プラットフォーム","platLead":"メインのプラットフォームは Windows です。Android と Kodi は Switch 2 のコントローラーに対応しています。","platWinH":"Windows 10 / 11","platWinP":"対応するすべてのコントローラーを Xbox 360 または DualShock 4 コントローラーとして使用 – ボタン割り当て、ゲームごとのプロファイル、ジャイロに対応。","platKodiH":"Kodi / LibreELEC","platKodiP":"Switch 2 のコントローラーを Kodi と RetroArch で Xbox コントローラーとして使用。DevCatSKZ Repository からインストールでき、自動で更新されます。Raspberry Pi 4 で動作確認済み。","platKodiBtn":"DevCatSKZ Repository へ","platAndH":"Android（ベータ）","platAndP":"Switch 2 のコントローラーを、ゲーム、エミュレーター、クラウドゲーミング用の Xbox コントローラーとして使用 – Shizuku または root 経由。代わりにタッチ操作としても使えます。Android 8 以降。","platAndBtn":"APK をダウンロード（0.9.3）","platAndGuide":"使い方","stepsTitle":"3 ステップで","s1h":"インストール","s1p":"セットアップを実行します。ViGEmBus と HidHide のドライバーも一緒にインストールされます。","s2h":"接続","s2p":"コントローラーの SYNC ボタンを押すと、SKZ Connect が見つけます。","s3h":"プレイ","s3p":"コントローラーは Steam、Game Pass、エミュレーター、その他のゲームで使えます。","featTitle":"機能","featLead":"Windows の多くのゲームは Xbox コントローラーにしか対応していません。SKZ Connect は対応するすべてのコントローラーを Xbox または DualShock 4 コントローラーとして出力します。","f1h":"Xbox または DualShock 4","f1p":"全コントローラー共通、またはコントローラーごとに設定。DualShock 4 は Steam 向けのモーションデータ付き。","f2h":"最大 8 台のコントローラー","f2p":"固定のプレイヤー位置。Joy-Con は単体でもペアでも使えます。","f3h":"ボタン割り当て","f3p":"キーボード、マウス、ターボ、マクロ – ゲームごとに自動で切り替わるプロファイル付き。","f4h":"モーション操作","f4p":"ジャイロをスティックまたはマウスとして使用、フリックスティック、エミュレーター用の DSU サーバー。","f5h":"コントローラーの重複なし","f5p":"HidHide が元のデバイスをゲームと Steam から隠します。","f6h":"ツール","f6p":"ドリフト対策のスティックキャリブレーション、テストページ、バッテリー低下の警告、ワンクリック更新。","connectTitle":"コントローラーの接続（Windows）","c1h":"Switch 2","c1p":"Pro Controller 2、Joy-Con 2、GameCube：<b>SYNC ボタン</b>を短く押します。Pro Controller と GameCube は USB でも接続できます。","c2h":"Switch","c2p":"Pro Controller、Joy-Con、NSO コントローラー：ランプが流れるまで <b>SYNC ボタン</b>を押します。","c3h":"Wii / Wii U","c3p":"赤い <b>SYNC ボタン</b>を押します – 電池ボックス内、または裏側にあります。","c4h":"PlayStation","c4p":"ライトバーが速く点滅するまで <b>PS + Share</b>（DualSense：<b>PS + Create</b>）を押し続け、SKZ Connect で <b>コントローラーを検索 …</b> を選びます。USB ケーブルでも接続できます。","c5h":"Xbox","c5p":"Windows は Xbox コントローラーに標準で対応しています。SKZ Connect はバッテリー表示とボタン割り当てを追加します。","connectNote":"次回からはボタンを押すだけで再接続します。Switch 2 のコントローラーは Windows の Bluetooth 設定に追加しないでください。","galleryTitle":"画面","g1alt":"プロファイル付きのボタン割り当て","g1cap":"プロファイル、ターボ、マクロ付きのボタン割り当て","g2alt":"スティックと振動の設定","g2cap":"スティック、トリガー、振動","g3alt":"1 台のコントローラーの設定","g3cap":"コントローラーごとの設定","padsTitle":"対応コントローラー","padsLead":"Windows では Bluetooth または USB で、同時に最大 8 台。Android と Kodi では Switch 2 のコントローラー。","padWired":"HORI、PowerA、PDP の有線コントローラー","faqTitle":"よくある質問","q1":"SKZ Connect の料金は？","a1":"かかりません。SKZ Connect は無料・広告なしのオープンソースです（MIT ライセンス）。","q2":"Bluetooth は必要ですか？","a2":"ワイヤレスのコントローラーには必要です。Switch 2 のコントローラーには Bluetooth LE が必要です。多くのコントローラーは USB ケーブルでも使えます。","q3":"Steam でコントローラーが 2 つ表示されます。","a3":"SKZ Connect で <b>全般 → 出力 → 元のコントローラーを隠す</b> をオンにし、Steam を再起動してください。","q4":"コントローラーを引き続きゲーム機で使えますか？","a4":"はい。Switch 2 のコントローラーは 1 台の機器だけを記憶します。ゲーム機でもう一度ペアリングすれば、そこでいつも通り使えます。","q5":"インストールなしで使えますか？","a5":"はい、ポータブル版 (ZIP) で使えます。その場合、ViGEmBus と HidHide のドライバーがインストール済みである必要があります。","q6":"Android で使えるコントローラーは？","a6":"Switch 2 のコントローラー（Pro Controller 2、Joy-Con 2、GameCube）のみです。Xbox と PlayStation のコントローラーには Android 自体が対応しています。Switch 1 のコントローラーは、Android では通常ボタンとスティックのみ使えます。","q7":"うまく動かないときは？","a7":"SKZ Connect で <b>全般 → 詳細 → 診断情報をエクスポート</b> を実行し、ファイルを<a href=\"https://github.com/DevCatSKZ/SKZ-Connect/issues\">不具合の報告</a>に添付してください。","legal":"devcatskz による非公式のオープンソース プロジェクトで、Nintendo、Sony、Microsoft とは関係ありません。商標は各所有者に帰属します。","source":"ソースコード","allReleases":"すべてのバージョン","bugs":"問題を報告"},
zh: {"name":"简体中文","title":"SKZ Connect – 适用于 Windows、Android 和 Kodi 的控制器","navPlat":"平台","navFeatures":"功能","navConnect":"连接","navControllers":"控制器","navFaq":"帮助","tagline":"在 Windows 上的任何游戏中使用任天堂、PlayStation 和 Xbox 控制器。Switch 2 控制器也可在 Android 和 Kodi 上使用。","download":"下载 Windows 版","portable":"便携版 (ZIP)","meta":"免费 · 开源 · Windows 10 和 11","version":" · 版本 ","smartscreen":"SKZ Connect 没有代码签名。如果首次启动时 Windows 显示 <b>“Windows 已保护你的电脑”</b>，请点击 <b>更多信息 → 仍要运行</b>。","shotAlt":"SKZ Connect：显示已连接控制器、电量和实时按键的总览","platTitle":"平台","platLead":"Windows 是主要平台。Android 和 Kodi 支持 Switch 2 控制器。","platWinH":"Windows 10 / 11","platWinP":"所有支持的控制器均可作为 Xbox 360 或 DualShock 4 控制器使用——支持按键映射、每款游戏独立的配置文件和陀螺仪。","platKodiH":"Kodi / LibreELEC","platKodiP":"在 Kodi 和 RetroArch 中将 Switch 2 控制器用作 Xbox 控制器。通过 DevCatSKZ Repository 安装，自动更新。已在 Raspberry Pi 4 上测试。","platKodiBtn":"前往 DevCatSKZ Repository","platAndH":"Android（测试版）","platAndP":"在游戏、模拟器和云游戏中将 Switch 2 控制器用作 Xbox 控制器——通过 Shizuku 或 root，也可作为触控操作。需要 Android 8 或更高版本。","platAndBtn":"下载 APK（0.9.3）","platAndGuide":"使用说明","stepsTitle":"三个步骤","s1h":"安装","s1p":"运行安装程序。ViGEmBus 和 HidHide 驱动会一并安装。","s2h":"连接","s2p":"按下控制器上的 SYNC 键——SKZ Connect 会找到它。","s3h":"开玩","s3p":"控制器可在 Steam、Game Pass、模拟器和其他游戏中使用。","featTitle":"功能","featLead":"Windows 上的许多游戏只支持 Xbox 控制器。SKZ Connect 将每个支持的控制器输出为 Xbox 或 DualShock 4 控制器。","f1h":"Xbox 或 DualShock 4","f1p":"可统一设置或按控制器设置；DualShock 4 为 Steam 提供体感数据。","f2h":"最多 8 个控制器","f2p":"固定的玩家位置，Joy-Con 可单独或成对使用。","f3h":"按键映射","f3p":"键盘、鼠标、连发和宏——配置文件按游戏自动切换。","f4h":"体感控制","f4p":"陀螺仪可用作摇杆或鼠标，支持 Flick Stick 和用于模拟器的 DSU 服务器。","f5h":"不会出现重复控制器","f5p":"HidHide 会对游戏和 Steam 隐藏原始设备。","f6h":"工具","f6p":"用于消除漂移的摇杆校准、测试页面、低电量警告和一键更新。","connectTitle":"连接控制器（Windows）","c1h":"Switch 2","c1p":"Pro Controller 2、Joy-Con 2、GameCube：短按 <b>SYNC 键</b>。Pro Controller 和 GameCube 也可通过 USB 连接。","c2h":"Switch","c2p":"Pro Controller、Joy-Con 和 NSO 控制器：按 <b>SYNC 键</b>直到指示灯滚动。","c3h":"Wii 和 Wii U","c3p":"按下红色 <b>SYNC 键</b>——位于电池仓内或底部。","c4h":"PlayStation","c4p":"按住 <b>PS + Share</b>（DualSense：<b>PS + Create</b>）直到灯条快速闪烁，然后在 SKZ Connect 中选择 <b>搜索控制器 …</b>——或使用 USB 线连接。","c5h":"Xbox","c5p":"Windows 原生支持 Xbox 控制器。SKZ Connect 补充电量显示和按键映射。","connectNote":"之后按一下按键即可重新连接。请不要在 Windows 蓝牙设置中添加 Switch 2 控制器。","galleryTitle":"界面","g1alt":"带配置文件的按键映射","g1cap":"支持配置文件、连发和宏的按键映射","g2alt":"摇杆和振动设置","g2cap":"摇杆、扳机和振动","g3alt":"单个控制器的设置","g3cap":"按控制器设置","padsTitle":"支持的控制器","padsLead":"Windows 上通过蓝牙或 USB 连接，最多同时 8 个。Android 和 Kodi 上：Switch 2 控制器。","padWired":"HORI、PowerA、PDP 有线控制器","faqTitle":"常见问题","q1":"SKZ Connect 需要多少费用？","a1":"无需任何费用。SKZ Connect 免费、无广告且开源（MIT 许可证）。","q2":"需要蓝牙吗？","a2":"无线控制器需要；Switch 2 控制器需要蓝牙 LE。许多控制器也可通过 USB 线使用。","q3":"Steam 中控制器显示了两次。","a3":"在 SKZ Connect 中打开 <b>常规 → 输出 → 隐藏原始控制器</b>，然后重启 Steam。","q4":"还能继续在主机上使用控制器吗？","a4":"可以。Switch 2 控制器只记住一台设备：在主机上重新配对一次，之后即可照常使用。","q5":"不安装能用吗？","a5":"可以，使用便携版 ZIP。此时 ViGEmBus 和 HidHide 驱动必须已经安装。","q6":"Android 上支持哪些控制器？","a6":"仅支持 Switch 2 控制器（Pro Controller 2、Joy-Con 2、GameCube）。Android 本身支持 Xbox 和 PlayStation 控制器；Switch 1 控制器在 Android 上通常只能提供按键和摇杆。","q7":"遇到问题？","a7":"在 SKZ Connect 中选择 <b>常规 → 高级 → 导出诊断信息</b>，并将文件附在<a href=\"https://github.com/DevCatSKZ/SKZ-Connect/issues\">问题报告</a>中。","legal":"devcatskz 开发的非官方开源项目，与任天堂、索尼或微软无关。商标归各自所有者所有。","source":"源代码","allReleases":"所有版本","bugs":"报告问题"},
ko: {"name":"한국어","title":"SKZ Connect – Windows, Android, Kodi용 컨트롤러","navPlat":"플랫폼","navFeatures":"기능","navConnect":"연결","navControllers":"컨트롤러","navFaq":"도움말","tagline":"Nintendo, PlayStation, Xbox 컨트롤러를 Windows의 모든 게임에서 사용하세요. Switch 2 컨트롤러는 Android와 Kodi에서도 사용할 수 있습니다.","download":"Windows용 다운로드","portable":"포터블 버전 (ZIP)","meta":"무료 · 오픈 소스 · Windows 10 및 11","version":" · 버전 ","smartscreen":"SKZ Connect는 코드 서명되어 있지 않습니다. 처음 실행할 때 Windows에 <b>“Windows의 PC 보호”</b>가 표시되면 <b>추가 정보 → 실행</b>을 클릭하세요.","shotAlt":"SKZ Connect: 연결된 컨트롤러, 배터리 잔량, 실시간 버튼 표시가 있는 개요","platTitle":"플랫폼","platLead":"Windows가 주 플랫폼입니다. Android와 Kodi는 Switch 2 컨트롤러를 지원합니다.","platWinH":"Windows 10 / 11","platWinP":"지원되는 모든 컨트롤러를 Xbox 360 또는 DualShock 4 컨트롤러로 – 버튼 매핑, 게임별 프로필, 자이로 지원.","platKodiH":"Kodi / LibreELEC","platKodiP":"Kodi와 RetroArch에서 Switch 2 컨트롤러를 Xbox 컨트롤러로 사용합니다. DevCatSKZ Repository에서 설치하며 자동으로 업데이트됩니다. Raspberry Pi 4에서 테스트했습니다.","platKodiBtn":"DevCatSKZ Repository로 이동","platAndH":"Android (베타)","platAndP":"게임, 에뮬레이터, 클라우드 게이밍에서 Switch 2 컨트롤러를 Xbox 컨트롤러로 사용 – Shizuku 또는 루트를 통해, 또는 터치 조작으로. Android 8 이상.","platAndBtn":"APK 다운로드 (0.9.3)","platAndGuide":"가이드","stepsTitle":"3단계","s1h":"설치","s1p":"설치 프로그램을 실행하세요. ViGEmBus와 HidHide 드라이버가 함께 설치됩니다.","s2h":"연결","s2p":"컨트롤러의 SYNC 버튼을 누르세요. SKZ Connect가 컨트롤러를 찾습니다.","s3h":"플레이","s3p":"컨트롤러는 Steam, Game Pass, 에뮬레이터 및 기타 게임에서 작동합니다.","featTitle":"기능","featLead":"Windows의 많은 게임은 Xbox 컨트롤러만 지원합니다. SKZ Connect는 지원되는 모든 컨트롤러를 Xbox 또는 DualShock 4 컨트롤러로 출력합니다.","f1h":"Xbox 또는 DualShock 4","f1p":"전체 또는 컨트롤러별로 설정. DualShock 4는 Steam용 모션 데이터 포함.","f2h":"최대 8개 컨트롤러","f2p":"고정된 플레이어 위치, Joy-Con은 하나씩 또는 한 쌍으로.","f3h":"버튼 매핑","f3p":"키보드, 마우스, 터보, 매크로 – 게임별로 자동 전환되는 프로필 지원.","f4h":"모션 컨트롤","f4p":"자이로를 스틱이나 마우스로 사용, 플릭 스틱, 에뮬레이터용 DSU 서버.","f5h":"중복 컨트롤러 없음","f5p":"HidHide가 원래 장치를 게임과 Steam에서 숨깁니다.","f6h":"도구","f6p":"드리프트 대응 스틱 보정, 테스트 페이지, 배터리 부족 경고, 원클릭 업데이트.","connectTitle":"컨트롤러 연결 (Windows)","c1h":"Switch 2","c1p":"Pro Controller 2, Joy-Con 2, GameCube: <b>SYNC 버튼</b>을 짧게 누르세요. Pro Controller와 GameCube는 USB로도 연결됩니다.","c2h":"Switch","c2p":"Pro Controller, Joy-Con, NSO 컨트롤러: LED가 흐를 때까지 <b>SYNC 버튼</b>을 누르세요.","c3h":"Wii 및 Wii U","c3p":"빨간 <b>SYNC 버튼</b>을 누르세요. 배터리 칸 안 또는 아래쪽에 있습니다.","c4h":"PlayStation","c4p":"라이트 바가 빠르게 깜박일 때까지 <b>PS + Share</b>(DualSense: <b>PS + Create</b>)를 누르고 있다가 SKZ Connect에서 <b>컨트롤러 검색 …</b>을 선택하세요. USB 케이블로도 연결할 수 있습니다.","c5h":"Xbox","c5p":"Windows는 Xbox 컨트롤러를 기본 지원합니다. SKZ Connect는 배터리 표시와 버튼 매핑을 추가합니다.","connectNote":"그 후에는 버튼 한 번으로 다시 연결됩니다. Switch 2 컨트롤러를 Windows Bluetooth 설정에 추가하지 마세요.","galleryTitle":"화면","g1alt":"프로필이 있는 버튼 매핑","g1cap":"프로필, 터보, 매크로를 지원하는 버튼 매핑","g2alt":"스틱 및 진동 설정","g2cap":"스틱, 트리거, 진동","g3alt":"개별 컨트롤러 설정","g3cap":"컨트롤러별 설정","padsTitle":"지원 컨트롤러","padsLead":"Windows에서는 Bluetooth 또는 USB로 최대 8개까지 동시에. Android와 Kodi에서는 Switch 2 컨트롤러.","padWired":"HORI, PowerA, PDP 유선 컨트롤러","faqTitle":"자주 묻는 질문","q1":"SKZ Connect는 얼마인가요?","a1":"비용이 들지 않습니다. SKZ Connect는 무료이며 광고가 없는 오픈 소스입니다(MIT 라이선스).","q2":"Bluetooth가 필요한가요?","a2":"무선 컨트롤러에는 필요합니다. Switch 2 컨트롤러에는 Bluetooth LE가 필요합니다. 많은 컨트롤러는 USB 케이블로도 작동합니다.","q3":"Steam에 컨트롤러가 두 번 표시됩니다.","a3":"SKZ Connect에서 <b>일반 → 출력 → 원본 컨트롤러 숨기기</b>를 켜고 Steam을 다시 시작하세요.","q4":"게임기에서도 계속 컨트롤러를 사용할 수 있나요?","a4":"네. Switch 2 컨트롤러는 하나의 기기만 기억합니다. 게임기에서 한 번 다시 페어링하면 평소처럼 작동합니다.","q5":"설치 없이도 되나요?","a5":"네, 포터블 ZIP 버전으로 가능합니다. 이 경우 ViGEmBus와 HidHide 드라이버가 이미 설치되어 있어야 합니다.","q6":"Android에서는 어떤 컨트롤러가 작동하나요?","a6":"Switch 2 컨트롤러(Pro Controller 2, Joy-Con 2, GameCube)만 지원합니다. Xbox와 PlayStation 컨트롤러는 Android가 자체 지원하며, Switch 1 컨트롤러는 Android에서 대개 버튼과 스틱만 제공합니다.","q7":"작동하지 않는 것이 있나요?","a7":"SKZ Connect에서 <b>일반 → 고급 → 진단 정보 내보내기</b>를 실행하고 파일을 <a href=\"https://github.com/DevCatSKZ/SKZ-Connect/issues\">문제 신고</a>에 첨부하세요.","legal":"devcatskz의 비공식 오픈 소스 프로젝트이며 Nintendo, Sony, Microsoft와 관련이 없습니다. 상표는 각 소유자에게 있습니다.","source":"소스 코드","allReleases":"모든 버전","bugs":"문제 신고"},
};
// Anleitungs-Link: Deutsch → docs/anleitung, sonst englische Anleitung (docs/guide).
function andGuideLink(lang) { const a = document.getElementById("andGuide"); if (a) a.href = lang === "de"
  ? "https://github.com/DevCatSKZ/SKZ-Connect/blob/main/docs/anleitung/android.md"
  : "https://github.com/DevCatSKZ/SKZ-Connect/blob/main/docs/guide/android.md"; }
const order = ["de","en","es","fr","it","pt","nl","pl","ru","ja","zh","ko"];
const sel = document.getElementById("lang");
order.forEach(c => { const o = document.createElement("option"); o.value = c; o.textContent = I18N[c].name; sel.appendChild(o); });
let relTag = null;
function apply(code) {
  const t = I18N[code] || I18N.en, en = I18N.en;
  const get = k => t[k] !== undefined ? t[k] : en[k];
  document.documentElement.lang = code;
  andGuideLink(code);
  document.querySelectorAll("[data-i]").forEach(el => { const v = get(el.dataset.i); if (v !== undefined) el.innerHTML = v; });
  document.querySelectorAll("[data-i-alt]").forEach(el => { const v = get(el.dataset.iAlt); if (v) el.alt = v; });
  document.title = get("title");
  document.getElementById("ver").textContent = relTag ? get("version") + relTag.replace(/^v/, "") : "";
  try { localStorage.setItem("nc-lang", code); } catch (e) {}
}
let saved = null; try { saved = localStorage.getItem("nc-lang"); } catch (e) {}
const nav = (navigator.language || "en").slice(0, 2).toLowerCase();
const start = saved && I18N[saved] ? saved : (I18N[nav] ? nav : "en");
sel.value = start; apply(start);
sel.addEventListener("change", () => apply(sel.value));

// Neueste Version: Download-Knöpfe direkt auf Setup bzw. portable ZIP zeigen lassen.
fetch("https://api.github.com/repos/DevCatSKZ/SKZ Connect/releases/latest")
  .then(r => r.json())
  .then(rel => {
    const assets = rel.assets || [];
    const setup = assets.find(a => /Setup.*\.exe$/i.test(a.name)) || assets.find(a => a.name.endsWith(".exe"));
    const zip = assets.find(a => /Portable.*\.zip$/i.test(a.name));
    if (setup) document.getElementById("dl").href = setup.browser_download_url;
    if (zip) document.getElementById("dlzip").href = zip.browser_download_url;
    const apk = assets.find(a => /Android.*\.apk$/i.test(a.name));
    if (apk) document.getElementById("dlapk").href = apk.browser_download_url;
    relTag = rel.tag_name || null;
    apply(sel.value);
  })
  .catch(() => {});
</script>
