# Baut die Kodi-Add-ons von N-Connect (service.nconnect für LibreELEC/Linux samt Begleitmodus, plugin.nconnect.status,
# script.nconnect.bundle, repository.devcatskz) und veröffentlicht sie.
# - Jeder Lauf: ZIPs als Artefakt „Kodi-Plugin“.
# - Tag „v1.2.3“: Die service.nconnect-ZIPs zusätzlich ans GitHub-Release; neue Add-on-Versionen (addon.xml) ins
#   DevCatSKZ Repository (github.com/DevCatSKZ/kodi-repo) – dort holt Kodi sie automatisch. Abgelegt werden dieselben
#   ZIPs wie am Release; eine Version, die dort schon liegt, wird nie überschrieben (dann vorher hochzählen).
#   Zugang über das Secret KODI_REPO_DEPLOY_KEY: privater SSH-Schlüssel, dessen öffentlicher Teil als Deploy-Key mit
#   Schreibrecht nur in DevCatSKZ/kodi-repo hinterlegt ist. Fehlt das Secret, wird der Schritt mit Warnung übersprungen.
name: N-Connect – Kodi-Plugin
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["linux/**", "src/Switch2Pro.Protocol/**", ".github/workflows/kodi.yml"]
permissions:
  contents: write
concurrency:
  group: kodi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  kodi:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      HAS_KODI_REPO_KEY: ${{ secrets.KODI_REPO_DEPLOY_KEY != '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Add-ons bauen (LibreELEC: x86_64, arm64, arm)"
        run: powershell -NoProfile -ExecutionPolicy Bypass -File linux/build-kodi-addon.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Kodi-Plugin
          path: out/kodi/*.zip

      - name: An das GitHub-Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          # Das Windows-Release legt der andere Workflow an; falls er noch läuft, kurz warten.
          for ($i = 0; $i -lt 30 -and -not (gh release view $tag 2>$null); $i++) { Start-Sleep 20 }
          if (-not (gh release view $tag 2>$null)) { gh release create $tag --title "N-Connect $tag" --notes "Kodi-Plugin" }
          gh release upload $tag (Get-ChildItem out/kodi -Filter 'N-Connect-Kodi-*.zip').FullName --clobber

      - name: DevCatSKZ Repository – Deploy-Key fehlt
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KODI_REPO_KEY != 'true'
        run: Write-Host "::warning title=Kodi-Repository nicht aktualisiert::Secret KODI_REPO_DEPLOY_KEY fehlt – DevCatSKZ/kodi-repo wurde nicht aktualisiert. ZIPs aus dem Artefakt 'Kodi-Plugin' von Hand ablegen (linux/build-kodi-addon.ps1 -Repo) oder den Deploy-Key einrichten."

      - name: DevCatSKZ Repository auschecken
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KODI_REPO_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: DevCatSKZ/kodi-repo
          ref: main
          path: kodi-repo
          ssh-key: ${{ secrets.KODI_REPO_DEPLOY_KEY }}

      - name: Ins DevCatSKZ Repository legen
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KODI_REPO_KEY == 'true'
        run: |
          # Dieselben ZIPs wie am Release (-NoBuild); danach Index (addons.xml, .md5, .sha256, index.html) neu bauen.
          powershell -NoProfile -ExecutionPolicy Bypass -File linux/build-kodi-addon.ps1 -Repo -NoBuild -RepoDir kodi-repo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cd kodi-repo
          git config user.name devcatskz
          git config user.email devcatskz@gmail.com
          git add -A
          if (git status --porcelain) {
            git commit -m "N-Connect ${{ github.ref_name }}: Kodi-Add-ons aktualisiert"
            git push origin HEAD:main
          } else {
            Write-Host "Keine Änderung – alle Add-on-Versionen liegen schon im Repository."
          }
